# Free Muse Spark on the opencode harness (gateway-harness pilot).
#
# Same free tier Hermes uses (`scitex-free` provider: the local
# free-SKU gateway on 127.0.0.1:18779 fronting `opencode serve`
# :4096), but driven by opencode's own loop instead of Hermes:
# `harness: opencode` runs a loopback `opencode serve` as the session
# owner with the official TUI attached (`opencode attach`). SAC keeps
# the spec, Apptainer boundary, secrets, and routing; delivery is
# `POST /session/:id/message` (idle) or `prompt_async` (busy), never
# terminal typing.
#
# Host prerequisites (scitex-compute-04):
#   opencode serve --port 4096 --hostname 127.0.0.1   # free-SKU backend
#   export SCITEX_GENAI_GATEWAY_API_KEY="<local gateway key>"
#
# Per-agent rule: every opencode tunable lives under
# `spec.available_harnesses.opencode` below — edit this file, nothing
# global. `serve.port: auto` allocates a free loopback port per start;
# pin an integer for a fixed port. `approval_policy: never` keeps the
# container boundary as the permission envelope (Apptainer binds are
# the security boundary); `ask` is for attached-TUI sessions with a
# human present.
#
# Start:
#   mkdir -p ~/opencode-canary-work
#   cp examples/providers/opencode-tui-spark.yaml \
#      ~/.scitex/agent-container/agents/my-spark/spec.yaml
#   sac agents check my-spark
#   sac agents start my-spark --foreground
#   sac agents send my-spark "hello"
#   sac agents tail my-spark

apiVersion: scitex-agent-container/v3
kind: Agent

spec:
  runtime: tui
  harness: opencode
  host: ${HOSTNAME}
  # A host path (~/ expands); mkdir it before starting. sac emits no
  # implicit binds since 2026-06-23, so the home bind under
  # spec.apptainer.binds below is what makes this path visible
  # in-container (the "full" posture).
  workdir: ~/opencode-canary-work
  engine: scitex-free-muse-spark-1.3-contributor-free

  available_engines:
    # Free tier: Meta muse-spark through the local free-SKU gateway,
    # named via the provider registry so the loopback address lives in
    # one place. The secret stays in the environment; the derived
    # opencode.json references it as {env:...} only.
    scitex-free-muse-spark-1.3-contributor-free:
      model: muse-spark-1.3-contributor-free
      provider: scitex-free
    # Paid tier: Meta muse-spark (contributor) through the OpenCode Go
    # subscription. Per the Go endpoint table this model speaks
    # openai-responses, NOT chat-completions (measured 2026-09-28:
    # chat-completions answers ModelProtocolUnsupported), and every
    # request carries the stable x-opencode-session header for
    # routing/prompt-cache affinity. Privacy note: contributor pricing
    # lets Meta train on prompts/completions.
    opencode-go-muse-spark-1.3-contributor:
      model: muse-spark-1.3-contributor
      provider:
        base_url: https://opencode.ai/zen/go/v1/responses
        auth_token_env: OPENCODE_GO_API_KEY
        extra_headers:
          User-Agent: scitex-agent-container/opencode
          x-opencode-session: ${sac:session_id}

  available_harnesses:
    opencode:
      session:
        mode: fresh
        max_age_minutes: null
      approval_policy: never
      run_budget_seconds: 3600
      serve:
        port: auto

  python-venv: ''
  startup_commands: []
  startup_prompts: []
  listen: []
  extensions: {}
  mcp_servers: {}
  user: ''
  to_home: ./to_home

  health:
    enabled: false
    interval: 30
    timeout: 5
    method: sdk-alive

  restart:
    policy: never
    max_retries: 3
    backoff:
      initial: 30
      max: 300
      multiplier: 2
    prune_on_stop: false

  autonomous:
    enabled: false
    drive_until: DONE
    max_turns: 50
    idle_kick_after_s: 120
    kick_text: Continue. Print DONE when finished.

  apptainer:
    # sac-base carries the opencode + hermes binaries (verified
    # 2026-09-29: an empty image: does not resolve a SIF here).
    image: sac-base
    # "full" posture: whole home rw at its canonical path, covering
    # workdir. Adjust the username on other hosts.
    binds:
      - /home/ywatanabe:/home/ywatanabe:rw
    env: {}
    raw_args: []
    post: ''
    environment: {}
    def_file: ''
    nv: false
    rocm: false
    overlay: ''
    overlay_size: ''
    overlay_create_if_missing: true
    tmpfs_size: 2G
    relaxed: false
    fakeroot: false
    jail: false
    nested_build: false

  hooks:
    pre_start: []
    post_start: []
    pre_stop: []
    post_stop: []
    on_compact: []
    on_restart: []
    on_diff: []

  a2a:
    host: 127.0.0.1
    port: auto

  comms:
    channels: []
    outbound:
      siblings: allow
      parent: allow
    inbound:
      siblings: allow
      parent: allow
    a2a:
      listen: true

  lineage:
    group: ''
    may_spawn: true
