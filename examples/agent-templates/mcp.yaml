# mcp — minimal claude-code agent with MCP server wiring.
#
# Pattern: agent that needs tool access via the Model Context Protocol.
# Demonstrates the ``mcp_servers`` block. Adapt the server entry for
# your own MCP server (stdio | sse | http).
#
# Interpolation:
#   ${metadata.name}       — dir-as-SSoT agent name
#   ${ENV_VAR_NAME}        — read from the host env at start time

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: mcp

spec:
  runtime: docker
  image: scitex-agent-container:scitex
  dockerfile: scitex_agent_container/containers/Dockerfile.scitex
  model: sonnet
  workdir: ~/proj/example

  claude:
    flags:
      - --dangerously-skip-permissions
    session: continue-or-new

  mcp_servers:
    example-server:
      type: stdio                  # stdio | sse | http
      command: bun
      args:
        - run
        - "~/path/to/your/mcp_server.ts"
      env:
        SERVER_AGENT_NAME: "${metadata.name}"
        SERVER_TOKEN: "${EXAMPLE_TOKEN}"

  health:
    enabled: true
    interval: 60
    method: sdk-alive

  restart:
    policy: never

# EOF
