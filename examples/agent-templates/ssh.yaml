# ssh — agent that runs in an Apptainer SIF on a remote host.
#
# Pattern: cross-machine fleet member. F-CS12 introduced
# ``sac --on <peer> agent start <name>`` which ssh's into <peer>
# and runs sac there. The remote sac sees this yaml as a normal
# local invocation and does ``apptainer exec`` on its own
# filesystem. No sac-side ssh dispatch — that lives entirely in
# F-CS12's host group.
#
# Requirements on the remote host:
#   * apptainer installed (docker/podman support was removed
#     2026-05-13 for simplicity — sac is apptainer-only)
#   * sac itself installed (so ``sac --on host`` actually finds a
#     remote sac to dispatch to)
#   * an entry under ``peers:`` in ~/.scitex/agent-container/config.yaml
#     on the laptop pointing at this host

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: ssh

spec:
  runtime: apptainer
  workdir: ~/proj/example

  apptainer:
    image: ~/.scitex/agent-container/containers/sac-scitex.sif

  claude:
    model: sonnet
    flags:
      - --dangerously-skip-permissions
    session: continue-or-new

  health:
    enabled: true
    interval: 60
    method: sdk-alive

  restart:
    policy: on-failure
    max_retries: 3

# EOF
