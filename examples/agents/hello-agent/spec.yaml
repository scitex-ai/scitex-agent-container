# hello-agent — minimal hello-world agent matching the README quickstart.
#
# Copy this directory to get started:
#   cp -r examples/agents/hello-agent ~/.scitex/agent-container/agents/hello-agent
#   sac agents start hello-agent --foreground

apiVersion: scitex-agent-container/v3
kind: Agent

spec:
  runtime: apptainer

  # Placement is a RESOLVED hostname (`host: local` is banned; operator
  # directive 2026-07-10). ${HOSTNAME} resolves to the loading machine's
  # canonical hostname at load time — the portable spelling for example/
  # fixture specs. Real deployments write the concrete name (`hostname -s`,
  # e.g. `host: ywata-note-win`) or a `sac host list` peer to pin remote.
  host: ${HOSTNAME}

  # workdir — the in-container --pwd.
  workdir: /home/agent/work

  apptainer:
    image: ~/.scitex/agent-container/containers/sac-base.sif
    binds: []                   # explicit mounts; [] = nothing beyond state

  claude:
    model: haiku
    flags:
      - --dangerously-skip-permissions

  startup_prompts:
    - "Reply with the string 'Hello! I am hello-agent' and nothing else."

  health:
    enabled: true
    interval: 60
    method: sdk-alive

  restart:
    policy: never
    max_retries: 0

# EOF
