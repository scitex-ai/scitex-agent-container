name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  tests:
    uses: scitex-ai/.github/.github/workflows/ci-sif-matrix.yml@main
    with:
      suite: matrix
