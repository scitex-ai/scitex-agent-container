name: tests

# THE PR GATE AND THE RELEASE GATE ARE NOW THE SAME ENVIRONMENT.
#
# They were not, and that is why PyPI sat at 0.21.17 while v0.21.18, v0.21.19
# and eight older tags shipped NOTHING. The two gates disagreed by construction:
#
#   PR gate      ubuntu-latest, ephemeral $HOME, `pytest tests/`  SINGLE-PROCESS
#   release gate Spartan self-hosted, persistent $HOME, in the SIF,
#                `pytest -n $(nproc) --dist load`                 xdist
#
# A green PR therefore predicted NOTHING about the release. The PR gate was
# STRUCTURALLY INCAPABLE of observing a concurrency bug — no amount of care in
# review could have caught `sqlite3.IntegrityError: UNIQUE constraint failed:
# a2a_ports.port` (v0.21.19) or `no free a2a port` (v0.21.18), because
# single-process pytest cannot race with itself. The tag got pushed, `test`
# failed on the release runner, `build`/`publish`/`release` were skipped
# (`needs: test`), and nothing reached PyPI. Silently. For months.
#
# The cure is not "test harder". It is to DELETE THE DIFFERENCE: this workflow
# now invokes the SAME script (`.github/ci/run-in-sif.sh`, via exec-in-sif.sh)
# on the SAME runner expression (`vars.CI_RUNS_ON`) as
# pypi-publish-and-github-release-on-tag.yml. Not "an equivalent setup" —
# the same bytes. Green PR => green release, by construction.
#
# WHERE THIS RUNS, AND WHY — WRITTEN AS A PRINCIPLE, NOT AS AN ABSOLUTE.
#
# This header used to read "Operator rule (2026-07-14, absolute, no exceptions):
# NO GitHub-hosted runners anywhere in this repo, PR tests included." That
# sentence was FALSE ON THE DAY IT WAS WRITTEN — cla.yml has always been a
# deliberate security carve-out — and it went on being quoted as an absolute
# into six other workflow files. An absolute with live exceptions does not get
# obeyed; it gets discovered, disbelieved, and worked around. So this states the
# PRINCIPLE and points at the mechanism, rather than asserting a rule that the
# next operator decision will falsify again:
#
#   * ANYTHING A HUMAN WAITS ON RUNS ON HARDWARE WE CONTROL — this gate, lint,
#     import-smoke, docs. That is why there is deliberately no `ubuntu-latest`
#     escape hatch below: adding one HERE is the bug, not the fix. If our pool
#     misbehaves, that is OURS to fix.
#   * A JOB NOBODY WAITS ON MAY RUN ON GITHUB'S HARDWARE when there is a written
#     argument for it. Today that is cla.yml (security) and the 3.12 nightly
#     (cost — hosted runners are free for public repos and slow, which is the
#     right trade when no human is blocked). Both live in
#     .github/hosted-runner-allowlist.yaml WITH the argument attached, and
#     _hosted_runner_guard.py fails CI on an exception that is undocumented or
#     stale. "No hosted runners" is shorthand for "none outside that file".
#
# WHICH MACHINES "OUR POOL" MEANS IS NOT SETTLED, AND THIS FILE DOES NOT SAY.
# It resolves `vars.CI_RUNS_ON` — a repository Variable — precisely so the pool
# can change without editing workflows. It is changing right now: the spartan
# nodes were banned from CI, and the operator moved on 2026-08-12 to re-admit
# them (four org runners + three spartan ≈ 75% more capacity), gated on
# scitex-dev #575-#578 — the four PRs that stop tests asserting facts about the
# machine they run on. Until those land, the SAME code goes green on spartan and
# red on an org runner, which would make this gate's verdict depend on which
# runner picked the job up. Do not add spartan labels here to "help"; the switch
# is flipped in the Variable, once those PRs land.
#
# THE THREE PATHS HAVE DIFFERENT AUDIENCES, WHICH IS WHY THE SAME SUITE RUNS
# THREE SHAPES:
#
#   PR gate    3.11 + 3.13            a human is waiting  -> optimise LATENCY
#   nightly    3.12 (hosted)          nobody is waiting   -> optimise COST
#   release    3.11 + 3.12 + 3.13     correctness only    -> optimise COVERAGE
#
# THE ENDS OF THE RANGE, NOT ONE VERSION. Dropping to a single leg was measured
# and rejected the same night: scitex-dev #578 (a fix for LD_LIBRARY_PATH being
# stripped from child processes, 21 tests) failed on 3.11 and 3.13 and PASSED on
# 3.12 — only the ends link libpython dynamically. A one-leg gate picked from
# the middle would have shipped it, and a one-leg gate picked from an end is one
# interpreter's build options away from the same hole. Min and max bracket the
# range; the middle is what the nightly is for.
#
# So a green PR does NOT have to predict a green release on its own — the
# release gate (pypi-publish-and-github-release-on-tag.yml) runs the FULL matrix
# in this same SIF before anything reaches PyPI, and the nightly is the
# early warning that a 3.12/3.13-only regression exists days before a tag.
# Pushes to `develop`/`main` also keep the full matrix here, so the version that
# is NOT on the PR gate is still exercised in the release-identical environment
# on the very merge that introduces it.
#
# Constitution §4: freshness comes from discarding the ENVIRONMENT, not the
# runner — a shared read-only base SIF, and per-job scratch created and
# destroyed inside it. The allocation persists, so there is nothing to queue
# for; the environment is fresh, so there is nothing to rot.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly 17:00 UTC (~02:00 JST), off-peak — KEPT even though
    # nightly-python-matrix-on-github-hosted.yml now also runs nightly, because
    # the two watch different things. That one watches the CODE on 3.12/3.13
    # using GitHub's stock image; this one watches the ENVIRONMENT — the shared
    # ci-cpu.sif, its baked interpreters and the layered [all,dev] install are
    # infrastructure that changes OUTSIDE this repo, and this is the only daily
    # run that would notice such drift before a tag does. At 02:00 JST our nodes
    # are idle, so it competes with nobody.
    - cron: "0 17 * * *"
  workflow_dispatch:

# STOP RE-TESTING COMMITS THAT A NEWER PUSH HAS ALREADY REPLACED.
#
# MEASURED on this repo, 2026-08-11, over the last 276 push/pull_request runs:
#
#     runs a newer push obsoleted while they were still in flight   86  (31.2%)
#     total CI machine time                                       3591  min
#     machine time spent on those already-stale runs              1841  min  (51.3%)
#
# HALF of every minute this repo's runners spend is spent proving something
# about a commit nobody will merge. It is not a capacity problem — the same
# window measured queue at 72.2% of job latency on 2 runner slots, and the
# cheapest way to buy back a slot is to stop occupying it with dead work.
# An agent pushing three fixups to a PR fires three full gates and, until now,
# all three ran to completion.
#
# THE GROUP EXPRESSION IS THE WHOLE DESIGN, so read it before simplifying it:
#
#   pull_request  ->  group = <workflow>-<PR number>. The PR's previous,
#                     superseded run is cancelled the moment a new push lands.
#                     This is the case the numbers above are about.
#
#   everything    ->  group = <workflow>-<run id>, which is UNIQUE PER RUN, so
#   else              the run is alone in its group and NOTHING is ever
#                     cancelled or queued behind anything.
#
# That second line is not padding — it is the guard. The obvious spelling,
# `group: ${{ github.workflow }}-${{ github.ref }}`, puts every push to
# `develop` into ONE group; with cancel-in-progress false they would then
# SERIALISE (one active run per group), and with it true a push to `develop`
# would CANCEL the in-flight run that autobump-release-sweep.yaml and
# auto-merge-to-develop.yaml read the conclusion of. Keying non-PR events on
# run_id makes this change a strict no-op for `main`, `develop`, the nightly
# cron and every workflow_dispatch — it only ever removes work from PRs.
#
# `cancel-in-progress: true` is therefore safe unconditionally: only the
# pull_request branch of the expression can ever produce a shared group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
  SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}

permissions:
  contents: read
  id-token: write

jobs:
  test:
    # DO NOT RENAME without updating branch protection in the same change.
    # This exact string is a REQUIRED status check on BOTH `develop` and `main`.
    # Rename the job and the required check never reports, so every PR sits at
    # mergeStateStatus=BLOCKED with all checks passing — which has already held
    # a release hostage once (see the timeout note below). The "on-ubuntu" in
    # the name is now a misnomer: the job runs on Spartan. Correcting the name
    # is a separate, coordinated change (rename job + update both branch
    # protection rules atomically), NOT a drive-by edit.
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    # Identical expression to the release workflow's `runs-on`, on purpose:
    # both gates must resolve to the same runner set from the same variable.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    # A hung leg used to run to GitHub's 6-HOUR default. This has bitten twice,
    # both times invisibly — nothing failed, a job simply never finished:
    #   * PR #594 burned 1h39m42s before the platform killed it, and the run was
    #     then misread for days as "the self-hosted runners are slow" (it never
    #     touched one — it was cancelled mid-run by a repository transfer).
    #   * A duplicate py3.11 leg hung for 40+ min while its two siblings
    #     finished in 11, and — because these three are the REQUIRED status
    #     checks on `main` — it held the v0.21.14 release PR at
    #     mergeStateStatus=BLOCKED with every check actually passing.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # THE ENDS OF THE RANGE ON A PULL REQUEST, THE FULL SET EVERYWHERE ELSE.
        #
        # MEASURED 2026-08-11/12: all four CPU runners saturated while several
        # stacked PRs each fanned out three legs of the heaviest job on the
        # queue. Dropping the middle leg is a 1/3 cut to that job — an honest
        # third, not a headline: this does not make CI twice as fast, it stops
        # one of every three heavy legs from being queued behind the others.
        # The version it drops is covered by
        #   * nightly-python-matrix-on-github-hosted.yml (daily, someone else's
        #     hardware), and
        #   * this same job on the `develop`/`main` push that merges the PR, and
        #   * the release gate, which runs all three before anything ships.
        #
        # SPELLING: one `fromJSON` over two STRING literals, not
        # `cond && fromJSON(a) || fromJSON(b)`. Both forms work, but the string
        # form has no truthiness trap — an empty/short array operand in the
        # second form would silently fall through to the other branch.
        #
        # THESE TWO LISTS ARE THE ONLY PLACE THE PR/BRANCH SPLIT IS WRITTEN, and
        # tests/integration/test_ci_python_matrix_shape.py DERIVES the rest from
        # them: the PR list must be exactly [oldest, newest] of the full list,
        # the nightly must be exactly the full list MINUS the PR list, the
        # release matrix must equal the full list, and the full list must agree
        # with pyproject's declared classifiers. A Python bump that edits one
        # place and not the others turns that test RED instead of half-applying
        # in silence — which is the failure mode this fleet keeps hitting.
        python-version: >-
          ${{ fromJSON(github.event_name == 'pull_request'
                       && '["3.11","3.13"]'
                       || '["3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@v7

      # THE SAME SCRIPT THE RELEASE GATE RUNS. exec-in-sif.sh apptainer-execs
      # the shared read-only ci-cpu.sif (which bakes python 3.11/3.12/3.13 at
      # /opt/venv-<ver>); run-in-sif.sh layers THIS checkout + [all,dev] into a
      # writable node-local target and runs the suite under xdist.
      #
      # No setup-python: the bare Spartan node has no Python tool cache and that
      # action fails there ("version 3.x not found for this OS"). No apt install
      # of fd: it is baked into the SIF. Both are why the SIF exists.
      #
      # There is deliberately NO credential-provisioning step here, and its
      # absence is load-bearing. The hosted gate used to materialise
      # ~/.claude/.credentials.json from a repo secret. On a PERSISTENT
      # self-hosted runner $HOME is the OPERATOR'S REAL HOME — that step would
      # CLOBBER the live fleet credential every CI run. Creds-gated tests skip
      # cleanly without it, exactly as they already do on the release gate.
      - name: Run tests in the reused CI SIF (apptainer exec — deps layered, not on the bare runner)
        run: bash .github/ci/exec-in-sif.sh run-in-sif.sh ${{ matrix.python-version }}

      # OIDC avoids a repository upload token while still authenticating every
      # upload. Codecov has not activated this repository yet, so keep its
      # explicit upload failure visible without overriding a green test suite.
      # 3.11, NOT 3.12: the upload has to key on a leg that EXISTS in every
      # event shape. Since the PR gate now runs the floor version alone, keying
      # on 3.12 would mean no pull request ever uploads coverage again — the
      # exact silent half-application this change is trying not to commit.
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.11'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true

      # THE RUNNER IS PERSISTENT — WHAT THIS JOB WRITES TO /tmp IS OURS TO
      # REMOVE. run-in-sif.sh's scratch (the [all,dev] --target install, the uv
      # cache, XDG_CACHE_HOME, every tmp_path) is 1.8-2.2 GB per leg. Nothing
      # removed it until 2026-08-09, by which point 116 survivors had filled the
      # root filesystem of a box running twelve fleet agents.
      #
      # `always()` so it also fires on FAILURE and on CANCELLATION — a separate
      # step process the runner starts after the work step is torn down, so it
      # races none of the signals that killed it. Traps cannot do this: both
      # script layers end in `exec`, which discards them.
      #
      # LAST, and scoped to ${{ matrix.python-version }}. Last because Codecov
      # reads ./coverage.xml — that file is in the checkout, not in the scratch,
      # but ordering removes the question. Scoped because all three legs share
      # GITHUB_RUN_ID: a cleanup keyed on the run alone would delete the LIVE
      # scratch of the two siblings still running.
      - name: Remove this leg's CI scratch (persistent runner — nothing else reclaims it)
        if: always()
        run: bash .github/ci/clean-tmpdir.sh run-in-sif.sh ${{ matrix.python-version }}
