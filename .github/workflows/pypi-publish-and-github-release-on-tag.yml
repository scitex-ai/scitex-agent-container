name: release

# The requested existing tag must resolve to this run's source commit. Tests
# keep the fixed central full all/dev SIF body for 3.11, 3.12 and 3.13. Its
# registered image/runtime/PG/source closure must qualify before packaging.
# develop -> main promotion remains a separate deliberate operation.
# The PyPI publisher stays a standard top-level job in this SAME file and
# environment; reusable workflows are not a Trusted Publisher replacement.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing vX.Y.Z tag; dispatch from its exact commit'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  runner-admission:
    uses: scitex-ai/.github/.github/workflows/runner-admission.yml@main
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'

  preflight:
    needs: runner-admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    env:
      RELEASE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
      REQUESTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Require the existing shared organization admission
        run: test "$RELEASE_AUTHORIZED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pure release boundary controls
        run: python -I .github/ci/test_release_identity.py
      - name: Resolve the existing tag and exact workflow source
        id: identity
        run: python -I .github/ci/release-identity.py resolve --tag "$REQUESTED_TAG"

  test:
    needs: preflight
    # The shared callee's matrix profile is all THREE minors for tag pushes
    # and workflow_dispatch. This is a context transition to test / test-sac-py*.
    # A null/unqualified image is a real refusal, never a native/hosted fallback.
    uses: scitex-ai/.github/.github/workflows/ci-sif-matrix.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      suite: matrix
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'
      ci_xdist_workers: ${{ vars.CI_XDIST_WORKERS }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: [runner-admission, preflight, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      RELEASE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Bind the declared packaging interpreter
        run: echo "BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Build and bind the whole source, metadata and genuine test run
        run: bash .github/ci/build-in-sif.sh 3.12
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: dist-${{ needs.preflight.outputs.commit }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [runner-admission, preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-agent-container
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      RELEASE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Bind the declared publisher interpreter
        run: echo "PUBLISH_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.preflight.outputs.commit }}
          path: dist
      - name: Publish verified whole artifacts through the existing OIDC publisher
        run: bash .github/ci/publish-in-sif.sh 3.12
      - name: Verify the exact wheel and sdist bytes served by PyPI
        run: python -I .github/ci/release-identity.py verify-index --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --revalidate

  release:
    needs: [runner-admission, preflight, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      RELEASE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.preflight.outputs.commit }}
          path: dist
      - name: Revalidate source and artifact identity before GitHub publication
        run: python -I .github/ci/release-identity.py verify-proof --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --revalidate
      - name: Extract release notes from the qualified source
        run: |
          python -I - <<'PY'
          import os,re
          from pathlib import Path
          version=os.environ['RELEASE_TAG'][1:]
          text=Path('CHANGELOG.md').read_text()
          match=re.search(r'^## \['+re.escape(version)+r'\].*?\n(.*?)(?=^## \[|\Z)', text, re.M|re.S)
          Path('release-notes.md').write_text(match[1] if match else 'Release v'+version+'. See CHANGELOG.md for details.\n')
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.commit }}
          name: ${{ needs.preflight.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
