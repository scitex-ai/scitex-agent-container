name: auto-merge-to-develop
# Merge green PRs that TARGET develop.
#
# *** WHY THERE IS A CRON HERE — READ BEFORE REMOVING IT ***
# This workflow STOPPED FIRING ON 2026-07-09. Not "failed" — STOPPED. Its newest
# run is 2026-07-09T23:10:04Z (event=check_suite); there are ZERO runs after it,
# and the workflow was `active` the whole time with the file present on main and
# allow_auto_merge=true. 37 of the 49 repos carrying this workflow saw their last
# run inside one ~2-hour window that same day, so whatever happened was
# org/platform-level, not a per-repo config change.
# 38 PRs were stranded green-and-unmerged across the fleet as a result.
#
# The failure mode is the important part: a workflow that is never TRIGGERED
# leaves NO RUN RECORD, so there is nothing to go red, nothing to alert on, and
# nothing to notice. It was silent for 8 DAYS while every agent kept reading
# "CI is green" as "my PR will land". That is `reference-evidence-that-could-not-
# have-disagreed` in its purest form: green CI cannot disagree with "this will
# merge", because CI does not observe the merge.
#
# The mechanism that killed the check_suite event is UNPROVEN. (In sac every
# auto-merge run on 07-08/07-09 corresponds 1:1 within 1-3 SECONDS to a codecov
# check-suite completion, and codecov went silent at exactly 2026-07-09T23:10:03Z
# — but scitex-hub fired 344 times off github-actions suites with ZERO codecov
# suites, which refutes the tidy story.) So this fix DELIBERATELY DOES NOT DEPEND
# ON THE MECHANISM: a cron tick is delivered by GitHub's scheduler and does not
# need any app, any check suite, or any event to arrive. Whatever broke the
# event, the sweep outlives it.
#
# *** THE RUN HISTORY IS THE HEARTBEAT. *** That is half the value, not a
# side-effect. A check_suite event that never arrives is invisible; a SCHEDULED
# run that never happens is a VISIBLE GAP in this workflow's run list. The next
# 8-day silence should be one glance loud. So: do NOT add an `if:` that skips the
# whole job on schedule, and do NOT make the job exit in a way that leaves no run
# record. A boring green run every 15 minutes IS the product.
#
# A github.token merge push triggers NO workflows (recursive-run
# suppression), so develop's gates are dispatched explicitly after a merge.
#
# GitHub reads schedule- AND check_suite-triggered workflows from the DEFAULT
# branch (main), so this file lives on main but acts ONLY on PRs whose base is
# develop. codecov + readthedocs checks are ignored (advisory). Fail-safe: if a
# merge is blocked by branch policy the PR simply stays open.
#
# *** THIS FILE TAKES EFFECT ONLY ONCE IT REACHES main. ***
# Editing it on develop changes NOTHING at runtime until develop is promoted to
# main. Until that promotion the version ACTUALLY EXECUTING is whatever main
# holds. That is a property of GitHub's event model, not an escape hatch.
#
# RUNNER (operator rule 2026-07-14, absolute, no exceptions): NO GitHub-hosted
# runners anywhere in this repo. If Spartan misbehaves, that is OURS to fix —
# never fall back to a hosted runner.
#
# WHAT ubuntu-latest WAS HIDING HERE: `gh`. The hosted image preinstalls the
# GitHub CLI; the bare Spartan node does NOT have it. This is not a guess —
# the release pipeline already ate it: `gh release create` failed with
# `gh: command not found` (exit 127) AFTER a successful PyPI publish, so a
# version shipped with no Release page. That workflow's fix was to swap to a JS
# action. This one CANNOT do that: its whole body is `gh` (`gh api`,
# `gh pr view --json statusCheckRollup`, `gh pr merge --admin`), and
# statusCheckRollup is a GraphQL-only field. Reimplementing it in
# actions/github-script would be a from-scratch rewrite of the logic that
# decides WHETHER TO AUTO-MERGE — precisely the code where a subtle bug merges
# a red PR. So: keep the battle-tested logic byte-for-byte, and BOOTSTRAP `gh`
# instead. The version is pinned (no moving refs).
#
# NOTE: `jq` is NOT assumed to exist on the bare node either — every filter below
# goes through `gh --jq` (gh embeds its own jq). Do not introduce a bare `jq`.
#
# *** A HOLD MUST BE A MECHANISM, NOT AN INTENTION. ***
# On 2026-08-12 a PR that an agent had DELIBERATELY HELD — it relaxed a guard the
# operator had escalated — was merged anyway, with no review and no comment. The
# hold was real; it just lived in one agent's head. Nothing in the repository knew
# a hold had been declared, so nothing in the repository could honour it. An
# intention that no mechanism reads is not a hold, it is a hope.
# This sweep therefore REFUSES to merge any PR carrying a HOLD MARKER:
#   * a `hold` / `do-not-merge` LABEL (see HOLD_LABELS below) — one click in the
#     GitHub UI, which is the whole point: the person most likely to need this is
#     the operator, and he must not have to edit YAML to stop a robot; or
#   * DRAFT status — already honoured before this change, but SILENTLY, which is
#     half a mechanism. It is now announced like any other hold.
# The refusal is ANNOUNCED (`::warning::`, naming the PR and the marker) on EVERY
# tick, not once. A silent skip reproduces the original bug in a new place: the
# hold works, nobody can tell that it worked, and the next reader assumes it did
# not. A held PR spends NO merge budget, so holding one PR never delays another,
# and REMOVING the marker lets it merge on the next tick with no other action.
# The markers are checked BEFORE CI state, so a held PR is reported as held even
# while it is red — "why didn't this merge" has one answer, not two.
#
# *** AN AUTOMATED MERGE MUST SAY THAT IT IS AUTOMATED. ***
# Every agent, every workflow and the operator all act through the SAME GitHub
# account, so `merged_by` carries NO information: it cannot distinguish "a watcher
# merged this the moment CI went green" from "a person read this diff and decided
# to merge it". Distinct per-agent identities would fix that at the source — that
# is a credentials decision, it belongs to the operator, and it is deliberately
# NOT made here. What this workflow can do without touching a single credential is
# leave a trace that does not depend on identity at all: it POSTS A COMMENT NAMING
# ITSELF AND ITS REASONS *BEFORE* it merges. If that comment cannot be posted the
# merge does NOT happen — an untraceable automated merge is precisely the defect
# the comment exists to close — and the PR waits for the next tick instead.
on:
  schedule:
    # Every ~15 min, deliberately OFF the top of the hour: GitHub queues all
    # :00 crons fleet-wide and drops/delays the overflow, so an on-the-hour
    # schedule is the least reliable one you can pick.
    - cron: "7,22,37,52 * * * *"
  # Legacy fast path — merge the moment checks complete. Dead since 2026-07-09
  # (see header); kept because if the event ever comes back it costs nothing and
  # cuts merge latency to seconds. The cron is what we actually rely on.
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what WOULD be merged, merge nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write         # gh workflow run (dispatch develop's post-merge gates)

# One sweep at a time per repo. Two concurrent sweeps would race on the
# one-merge-per-run budget and could land two PRs against the same unverified
# base — the exact thing the budget exists to prevent. Queue, never cancel:
# cancelling a run mid-merge is how you get a half-applied merge.
concurrency:
  group: auto-merge-to-develop-${{ github.repository }}
  cancel-in-progress: false

env:
  # Pinned, not `latest`: a moving ref is an unreviewed binary on a persistent
  # node whose $HOME is the operator's real home. Bump deliberately.
  GH_CLI_VERSION: "2.96.0"

jobs:
  automerge:
    # schedule + workflow_dispatch always run (the heartbeat must leave a
    # record). check_suite still only acts on a successful suite.
    if: ${{ github.event_name != 'check_suite' || github.event.check_suite.conclusion == 'success' }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    timeout-minutes: 15
    steps:
      - name: Ensure the gh CLI exists (the bare Spartan node has none)
        # $GITHUB_PATH only affects SUBSEQUENT steps, so this must be its own
        # step. No sudo / no apt on an HPC compute node — unpack the official
        # tarball into the job-scoped RUNNER_TEMP, which is discarded with the
        # job and never touches the operator's home.
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh already present: $(gh --version | head -1)"
            exit 0
          fi
          echo "gh not found on this runner — installing v${GH_CLI_VERSION} into RUNNER_TEMP"
          tgz="$RUNNER_TEMP/gh.tar.gz"
          curl -fsSL --retry 3 --max-time 120 -o "$tgz" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          bindir="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin"
          # fail-loud: a silently-missing gh would make the merge step's
          # `|| true` fallbacks read every PR as "not green" and quietly stop
          # auto-merging forever. Assert it actually runs.
          "$bindir/gh" --version
          echo "$bindir" >> "$GITHUB_PATH"

      - name: merge green PRs targeting develop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # *** 8-DAY-OLD GREEN IS NOT TODAY'S GREEN. ***
          # Every stranded PR's checks ran against a base that has since moved.
          # Merging N of them back-to-back means each merge invalidates the next
          # one's evidence, and this fleet has already been burned by exactly
          # that (`feedback-pr-green-is-not-develop-green`: adding tests re-rolls
          # xdist distribution and surfaces OTHER PRs' latent races — the merger
          # reveals the bug, it does not author it).
          # So: at most ONE merge per run. Combined with the develop-health gate
          # below and a 15-minute tick, the drain becomes "merge one, wait for
          # develop's post-merge CI, then the next" — enforced by the system
          # instead of by a human babysitting a loop. Raising this above 1 means
          # merging onto a base whose CI has not run yet. Don't.
          MAX_MERGES: "1"
          # HOLD MARKERS (space-separated, matched case-insensitively against the
          # PR's labels). Any one of these on a PR means "a human wants to look at
          # this first" and the sweep will not merge it. Keep them SHORT and
          # OBVIOUS: this list is a UI, and its user is a person clicking a label
          # in a hurry because a robot is about to merge something it should not.
          # Draft status is a hold too, and is handled alongside these.
          HOLD_LABELS: "hold do-not-merge"
          # An invisible signature on the attribution comment, so a retried tick
          # can recognise its own earlier comment instead of stacking another.
          # Changing this string orphans every comment already posted — the old
          # ones stay valid as a record, they just stop being recognised.
          ATTRIB_MARKER: "<!-- auto-merge-to-develop:attribution -->"
          # Space-separated; every entry must accept a bare workflow_dispatch.
          POST_MERGE_GATES: >-
            pytest-matrix-on-ubuntu-py3-11-3-12-3-13.yml
            quality-audit-on-ubuntu-latest.yml
            lint.yml
            import-smoke-on-ubuntu-py3-12.yml
            no-hosted-runners-guard-on-self-hosted.yml
        run: |
          set -uo pipefail

          # ---------------------------------------------------------------
          # BASE-BRANCH SCOPE: develop ONLY. main is deliberately EXCLUDED.
          # ---------------------------------------------------------------
          # (scitex-io#126 targets main and this workflow has never handled it.
          # Naming the decision instead of leaving it implicit:)
          #   1. main is the DEFAULT branch — the branch GitHub reads THIS FILE
          #      from. A sweep able to merge into main could rewrite its own
          #      merge policy with no human in the loop. Automation that can edit
          #      its own rules is not a sweep, it is a foothold.
          #   2. develop -> main is a RELEASE act with a deliberate ceremony in
          #      this fleet (`chore/promote-vX.Y.Z`). Auto-merging into main would
          #      silently bypass the cadence releases are actually run by.
          # PRs targeting main are therefore LISTED LOUDLY (so they cannot rot
          # unseen the way the last 8 days did) and NOT merged.
          merges=0
          # PRs that were green and unheld but could not be given an attribution
          # comment. Counted, not swallowed: it turns the run red at the end.
          attrib_failures=0

          # ---------------------------------------------------------------
          # GATE: develop must be SETTLED and GREEN before anything lands.
          # ---------------------------------------------------------------
          dev_sha=$(gh api "repos/$REPO/commits/develop" --jq .sha 2>/dev/null || echo "")
          if [ -z "$dev_sha" ]; then
            echo "::warning::cannot resolve develop's head — merging nothing this tick (fail-safe)"
            exit 0
          fi
          echo "develop head: $dev_sha"

          dev_bad=$(gh api "repos/$REPO/commits/$dev_sha/check-runs?per_page=100" --jq '
            [ .check_runs[]
              | select(((.name // "") | ascii_downcase | test("codecov|readthedocs")) | not)
              | select(.status == "completed")
              | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required")
            ] | length' 2>/dev/null || echo "")
          dev_busy=$(gh api "repos/$REPO/commits/$dev_sha/check-runs?per_page=100" --jq '
            [ .check_runs[]
              | select(((.name // "") | ascii_downcase | test("codecov|readthedocs")) | not)
              | select(.status != "completed")
            ] | length' 2>/dev/null || echo "")
          dev_total=$(gh api "repos/$REPO/commits/$dev_sha/check-runs?per_page=100" --jq '
            [ .check_runs[]
              | select(((.name // "") | ascii_downcase | test("codecov|readthedocs")) | not)
            ] | length' 2>/dev/null || echo "")

          # THREE STATES, NOT TWO. "I could not read develop's health" is NOT
          # "develop is green" — collapsing an unknown into a pole is the
          # `reference-binary-where-ternary-was-needed` bug. An unreadable gate
          # merges nothing and says so.
          if [ -z "$dev_bad" ] || [ -z "$dev_busy" ] || [ -z "$dev_total" ]; then
            echo "::warning::could not read develop's check state — merging nothing this tick (fail-safe)"
            exit 0
          fi

          if [ "$dev_busy" -gt 0 ]; then
            echo "develop CI still in flight ($dev_busy running) — the next tick is the wait. Merging nothing."
            exit 0
          fi
          if [ "$dev_bad" -gt 0 ]; then
            echo "::error::develop is RED ($dev_bad failing non-advisory checks on $dev_sha). Refusing to merge onto a broken base — fix develop first. This run is red ON PURPOSE: a stalled drain must be visible."
            exit 1
          fi
          if [ "$dev_total" -eq 0 ]; then
            # Absence of evidence is not evidence of green. Say so out loud
            # rather than silently treating "no checks" as "all good".
            echo "note: develop head has NO non-advisory check runs — no red signal to honour, proceeding"
          else
            echo "develop is green ($dev_total non-advisory checks, 0 failing) — sweep may proceed"
          fi

          # ---------------------------------------------------------------
          # Collect candidate PRs.
          # ---------------------------------------------------------------
          if [ -n "${HEAD_SHA:-}" ]; then
            prs=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[] | select(.state=="open") | .number' 2>/dev/null || true)
          else
            # --limit is LOAD-BEARING: `gh pr list` silently defaults to 30 and
            # truncates with no marker. sac alone holds 36 open PRs against
            # develop, so the default would have silently hidden six of them —
            # the same silent-undercount shape as the bug this file exists to
            # fix. Do not remove it.
            #
            # OLDEST-FIRST is also load-bearing. `gh pr list` returns
            # NEWEST-first, and with a one-merge-per-run budget a repo that keeps
            # producing fresh green PRs would push the oldest one down the list
            # forever — a starvation bug that looks exactly like the outage we
            # are fixing (a green PR that never lands, with nobody noticing).
            # FIFO cannot starve.
            prs=$(gh pr list --repo "$REPO" --base develop --state open --limit 200 \
                    --json number,createdAt --jq 'sort_by(.createdAt) | .[].number' 2>/dev/null || true)
          fi
          [ -z "${prs:-}" ] && { echo "no open PRs"; exit 0; }

          for pr in $prs; do
            if [ "$merges" -ge "$MAX_MERGES" ]; then
              echo "budget spent (MAX_MERGES=$MAX_MERGES) — remaining PRs wait for the next tick. This is the pacing, not a failure."
              break
            fi

            base=$(gh pr view "$pr" --repo "$REPO" --json baseRefName --jq .baseRefName 2>/dev/null || echo "")
            if [ "$base" = "main" ]; then
              echo "::warning::#$pr targets main — OUT OF SCOPE BY DESIGN (see header). It needs a deliberate human merge; it will never drain from here."
              continue
            fi
            [ "$base" = "develop" ] || { echo "skip #$pr (base=$base, not develop)"; continue; }

            # -------------------------------------------------------------
            # HOLD MARKERS — the one thing in this repo that can stop a merge.
            # -------------------------------------------------------------
            # Checked BEFORE CI state and BEFORE the merge budget, so a held PR
            # is reported as held whatever its checks say, and holding one PR
            # never costs another PR its turn. See the header for the incident.
            hold=""

            # Draft was already honoured; it was just never SAID. An unreadable
            # isDraft still counts as draft — fail-safe toward not merging.
            draft=$(gh pr view "$pr" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null || echo true)
            [ "$draft" = "true" ] && hold="draft"

            # Labels are lower-cased on both sides: GitHub preserves the case a
            # label was created with, and a hold spelled `Hold` must not sail
            # through because of a capital letter.
            pr_labels=$(gh pr view "$pr" --repo "$REPO" --json labels \
                          --jq '[.labels[].name | ascii_downcase] | join(" ")' 2>/dev/null || echo "__UNREADABLE__")
            if [ "$pr_labels" = "__UNREADABLE__" ]; then
              # "I could not read the labels" is NOT "there are no labels" — the
              # same three-states-not-two rule the develop gate above follows.
              # An unreadable hold is treated AS a hold.
              echo "::warning::#$pr HELD — could not read its labels, so a hold marker cannot be ruled out. Refusing to merge this tick (fail-safe); it will be re-read on the next one."
              continue
            fi
            for want in $HOLD_LABELS; do
              case " $pr_labels " in
                *" $want "*) hold="${hold:+$hold + }label:$want" ;;
              esac
            done

            if [ -n "$hold" ]; then
              # LOUD, and loud EVERY TICK. This annotation is the only evidence
              # that the hold is doing anything; a quiet `continue` here is the
              # original bug wearing a different hat.
              echo "::warning::#$pr is HELD ($hold) — auto-merge refuses to merge it. This is not a one-off skip: it will be refused on every tick until the marker is removed, and it costs no merge budget. Remove the label (or mark the PR ready for review) and it merges normally on the next tick, with no other intervention."
              continue
            fi

            pending=$(gh pr view "$pr" --repo "$REPO" --json statusCheckRollup --jq '
              [ .statusCheckRollup[]
                | select(((.name // .context // "") | ascii_downcase | test("codecov|readthedocs")) | not)
                | (.conclusion // .state // "")
                | select(. != "SUCCESS" and . != "NEUTRAL" and . != "SKIPPED" and . != "") ] | length' 2>/dev/null || echo 1)
            if [ "$pending" != "0" ]; then
              echo "PR #$pr not green ($pending) — skip"
              continue
            fi

            # -------------------------------------------------------------
            # mergeStateStatus IS COMPUTED LAZILY — handle it or undercount.
            # -------------------------------------------------------------
            # GitHub starts the mergeability computation when asked and answers
            # UNKNOWN until it finishes. A bulk `gh pr list --json
            # mergeStateStatus` returned UNKNOWN for 34 PRs during this bug's
            # investigation; re-asking each one INDIVIDUALLY surfaced 14 MORE
            # stranded PRs — a single-pass read UNDERCOUNTS BY ~40%. So: ask
            # per-PR, and poll until it settles.
            merge_state="UNKNOWN"
            for _ in 1 2 3 4 5 6; do
              merge_state=$(gh pr view "$pr" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null || echo "UNKNOWN")
              [ -n "$merge_state" ] && [ "$merge_state" != "UNKNOWN" ] && break
              sleep 3
            done

            case "$merge_state" in
              DIRTY)
                # A stale PR that no longer merges cleanly is a FINDING, not an
                # obstacle to force through. Rebasing someone else's branch
                # unattended is how you silently break their work.
                echo "::warning::#$pr no longer merges cleanly (DIRTY) — needs a rebase by its owner. Not forcing."
                continue ;;
              UNKNOWN)
                # DO NOT `continue` HERE. Treating UNKNOWN as "not mergeable"
                # would silently drop a green PR — rebuilding this bug's exact
                # signature (everyone believes it will land; it quietly doesn't)
                # INSIDE ITS OWN FIX. Fall through and let the merge attempt
                # decide: a failed merge is loud, a skipped PR is silent.
                echo "::warning::#$pr mergeStateStatus never settled after 6 polls — attempting the merge anyway (a loud failure beats a silent skip)" ;;
              *) ;;
            esac

            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN: would post the automation-attribution comment on #$pr and merge it -> develop (mergeStateStatus=$merge_state)"
              merges=$((merges + 1))
              continue
            fi

            # -------------------------------------------------------------
            # ATTRIBUTION FIRST, THEN THE MERGE.
            # -------------------------------------------------------------
            # `merged_by` cannot answer "was this a human?" in a fleet that
            # shares one GitHub account, so the answer is written where it does
            # not depend on identity: a comment on the PR itself, posted BEFORE
            # the merge. Before, not after, so that a merge can never exist
            # without its explanation — if the comment fails, nothing merges.
            run_url="${GITHUB_SERVER_URL:-https://github.com}/$REPO/actions/runs/${GITHUB_RUN_ID:-unknown}"
            attribution=$(printf '%s\n' \
              "$ATTRIB_MARKER" \
              "**Merged by automation. No human read this diff.**" \
              "" \
              "\`auto-merge-to-develop\` (\`.github/workflows/auto-merge-to-develop.yaml\` in this repo) is merging this pull request now — before you look for a reviewer, there wasn't one." \
              "" \
              "Why it merged:" \
              "" \
              "- base branch is \`develop\` (the only base this sweep touches);" \
              "- no hold marker: not a draft, and none of the labels \`$HOLD_LABELS\`;" \
              "- every non-advisory check on the PR head is green (codecov and readthedocs are advisory and ignored);" \
              "- \`develop\`'s own head was settled and green when the sweep ran, so this lands on a base that was known good;" \
              "- \`mergeStateStatus\` = \`$merge_state\`." \
              "" \
              "This comment exists because the merging IDENTITY cannot tell you any of that. Every agent, workflow and human in this fleet acts through the same GitHub account, so \`merged_by\` on this PR is the same name whether a watcher merged it on a green check or a person merged it after reading it. If you are reading this months later: it was the watcher." \
              "" \
              "To stop an automated merge, add a \`hold\` (or \`do-not-merge\`) label, or convert the PR to a draft. The sweep refuses a held PR on every tick and says so in its log; removing the marker lets it merge again." \
              "" \
              "Sweep run: $run_url")

            # A merge REFUSED by branch policy leaves the attribution comment
            # already posted, and the next tick would post another. The trace
            # must be present, not repeated — so look for the invisible marker
            # this workflow signs its comments with and post at most one.
            # (An unreadable comment list falls through to posting: a duplicate
            # comment is a nuisance, a missing one is the bug.)
            prior=$(gh pr view "$pr" --repo "$REPO" --json comments --jq '[.comments[].body] | join("\n")' 2>/dev/null || echo "")
            case "$prior" in
              *"$ATTRIB_MARKER"*)
                echo "#$pr already carries this automation's attribution comment from an earlier tick — merging without posting a second one." ;;
              *)
                if ! gh pr comment "$pr" --repo "$REPO" --body "$attribution"; then
                  echo "::error::#$pr — could NOT post the pre-merge attribution comment, so it was NOT merged. An automated merge that cannot say it was automated is the exact defect this comment exists to close; merging anyway would trade a small delay for an untraceable merge. The PR stays open and the next tick retries."
                  attrib_failures=$((attrib_failures + 1))
                  continue
                fi ;;
            esac

            if gh pr merge "$pr" --repo "$REPO" --merge --admin --delete-branch; then
              echo "MERGED #$pr -> develop (attribution comment posted first)"
              merges=$((merges + 1))
            else
              echo "::warning::blocked #$pr (merge refused — branch policy or a race). Left open on purpose. NOTE: its attribution comment was already posted; the next tick will post another when it retries."
            fi
          done

          echo "sweep complete: $merges merge(s) this run"

          # Collected so BOTH failure kinds get reported before the run exits;
          # an early `exit 1` here would hide the post-merge dispatch result,
          # which is the more dangerous of the two.
          rc=0
          if [ "$attrib_failures" -gt 0 ]; then
            echo "::error::$attrib_failures green PR(s) were NOT merged because their attribution comment could not be posted. This run is red ON PURPOSE: a drain stalled on attribution must be visible, not silent — that is the whole lesson of this workflow's header."
            rc=1
          fi

          # github.token pushes fire no workflows — dispatch the gates once per tick.
          if [ "$merges" -gt 0 ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN: would dispatch post-merge gates on develop: $POST_MERGE_GATES"
            else
              dispatch_failures=0
              for wf in $POST_MERGE_GATES; do
                if gh workflow run "$wf" --repo "$REPO" --ref develop; then
                  echo "dispatched $wf on develop"
                else
                  echo "::error::failed to dispatch $wf on develop — the merged head has NO CI of its own until something fires it"
                  dispatch_failures=$((dispatch_failures + 1))
                fi
              done
              if [ "$dispatch_failures" -gt 0 ]; then
                echo "::error::$dispatch_failures post-merge gate dispatch(es) failed. The merge itself LANDED; this run is red ON PURPOSE so an un-CI'd develop head cannot pass unnoticed."
                rc=1
              else
                echo "post-merge gates dispatched on develop"
              fi
            fi
          fi

          exit "$rc"
