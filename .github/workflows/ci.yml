name: ci

# ============================================================================
# CANONICAL scitex CI — thin org-reusable caller (the ONE per-repo shape).
# Rendered for scitex-agent-container by `scitex-dev ecosystem ci-template apply`.
#
# Job bodies live ONCE, org-side, at one reviewed immutable revision — a shared
# workflow cannot drift per-repo (operator decision, 2026-07-21, superseding
# the retired consolidated pr-ci.yml/release-ci.yml pair). This file carries
# only triggers, concurrency, and thin `uses:` calls.
# Pin the actual production commit qualified after the ordinary source merge;
# runner-group SHA admission must not assume branch/SHA alias equivalence.
#
# Runner policy (operator 2026-10-03): company compute02/03/04 runners are
# organization-only and require confirmed original actor, triggering actor
# and same-repository PR author membership. Forks and unknown membership
# run on GitHub-hosted hardware. Pass the repository/org CI_RUNS_ON preference
# to the authoritative reusable admission workflow; the preference and labels
# confer no authorization. An absent variable defaults to ubuntu-latest.
#
# Required-status-check contexts (branch protection must reference these;
# under workflow_call GitHub renders "<caller-job-id> / <reusable job name>"):
#   pytest-matrix / pytest-matrix-on-ubuntu-py<X.YY>
#   import-smoke / import-smoke-on-ubuntu-py3-12
#   quality-audit / audit
#   rtd-sphinx-build / docs-sphinx
# ============================================================================

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *" # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # Cancel superseded PR runs; non-PR runs key on run_id (unique per run),
  # so each is alone in its group and can neither cancel nor be cancelled
  # (preserves the retired release-ci.yml coalescing semantic).
  cancel-in-progress: true

# EACH JOB PASSES ONLY WHAT ITS CALLEE DECLARES. Measured 2026-08-05 against
# scitex-ai/.github:
#   pytest-matrix     workflow_call.secrets: CODECOV_TOKEN (required: false)
#   import-smoke      workflow_call: {}      -- declares nothing
#   quality-audit     workflow_call: {}      -- declares nothing
#   rtd-sphinx-build  workflow_call.inputs only, no secrets
# A callee that declares no secrets cannot RECEIVE one -- passing an undeclared
# secret is an error -- so those three take no `secrets:` key at all. That is
# why this is not a uniform "name the secret" edit.
#
# These triggers (pull_request / push / schedule) do NOT hand secrets to fork
# PRs, so this was never the attacker-triggerable exposure that cla.yml had.
# It is over-broad forwarding: every secret the repo holds, offered to four
# workflows that between them want one optional token. Fixed on merit.
jobs:
  pytest-matrix:
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@8c646081e9f1352077d3d8674052cce7ec75a1b7
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}

    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@8c646081e9f1352077d3d8674052cce7ec75a1b7
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}

  quality-audit:
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@8c646081e9f1352077d3d8674052cce7ec75a1b7
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}

  rtd-sphinx-build:
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@8c646081e9f1352077d3d8674052cce7ec75a1b7
    with:
      runs_on: ${{ vars.CI_RUNS_ON || '["ubuntu-latest"]' }}
