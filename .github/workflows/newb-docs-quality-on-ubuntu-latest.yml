name: newb

# Doc-quality verification — fresh Claude agent reads only the package's
# docs in a hard-isolated container, then tries to install + import +
# use the package. If a docs-only consumer can't follow them, neither
# can a real user.
#
# Cost-aware schedule: weekly cron + manual dispatch only. Per-PR runs
# are intentionally NOT enabled here (LLM API cost + run time).
#
# ── STATE OF THIS WORKFLOW, HONESTLY ────────────────────────────────────────
# It has FAILED EVERY SCHEDULED RUN for 5+ consecutive weeks (2026-06-15 →
# 2026-07-13, every one a `failure`). The cause is not the runner and not the
# docs: `secrets.NEWB_ANTHROPIC_API_KEY is not set on this repo`, so the job's
# own fail-early guard exits 1 before newb is ever invoked. It has therefore
# never once executed, and has burned zero LLM credits — only a weekly hosted
# runner minute and a permanently red badge.
#
# Two changes here, and they are separate claims:
#   1. RUNNER — migrated off ubuntu-latest (operator rule 2026-07-14, absolute,
#      no exceptions). This also forced the container backend change below.
#   2. MISSING SECRET — now a clean SKIP with a loud warning, not a hard fail.
#      An unset optional secret is a CONFIGURATION state, not a defect in the
#      code under test; failing an advisory, non-gating weekly job for it is a
#      false RED, and a badge that is always red trains everyone to ignore red.
#      The job still says so, loudly, in the run summary.
#      >> TO ACTUALLY ENABLE THIS: set NEWB_ANTHROPIC_API_KEY on the repo. <<
#
# WHAT ubuntu-latest WAS HIDING HERE: docker. The old job did `docker login
# ghcr.io` and let newb default to its Docker backend. Spartan compute nodes
# have NO docker (this is why the release pipeline cannot use the
# pypa/gh-action-pypi-publish Docker action either). newb ships an APPTAINER
# backend — `apptainer run docker://<image>`, which auto-pulls and caches the
# same OCI image — so the fix is `--runtime apptainer`, not a docker install.
# Apptainer is exactly what this HPC node does have.

on:
  schedule:
    - cron: "0 17 * * 1"  # weekly Mon 17:00 UTC (~Tue 02:00 JST)
  workflow_dispatch:

env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}

jobs:
  newb:
    # Kept byte-identical — see lint.yml. (Verified: not protection-pinned.)
    name: newb-docs-quality-on-ubuntu-latest
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read       # pull ghcr.io/ywatanabe1989/newb-runner

    steps:
      - uses: actions/checkout@v4

      - name: Is newb configured on this repo?
        id: guard
        env:
          NEWB_ANTHROPIC_API_KEY: ${{ secrets.NEWB_ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEWB_ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::secrets.NEWB_ANTHROPIC_API_KEY is not set on this repo — SKIPPING the docs-quality run."
            {
              echo "### newb: SKIPPED (not configured)"
              echo
              echo '`secrets.NEWB_ANTHROPIC_API_KEY` is not set on this repository, so the'
              echo 'docs-quality agent cannot run. This is a configuration gap, not a docs'
              echo 'failure — set the secret to enable this check.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v3
        if: steps.guard.outputs.enabled == 'true'
        with:
          # PINNED: unpinned `latest` made CI a function of wall-clock
          # time and runner cache state. See sac-ci-pin-uv-version-*.
          version: "0.11.29"
          cache-dependency-glob: pyproject.toml

      - name: Put the Spartan apptainer shim on PATH
        if: steps.guard.outputs.enabled == 'true'
        # The runner's job shell is --noprofile --norc (no Lmod), so the shim
        # must be placed on PATH explicitly — same as .github/ci/exec-in-sif.sh.
        # A quoted "~/…" is NOT tilde-expanded by the shell, so expand it here.
        # newb execs the bare name `apptainer`, so it must resolve on PATH.
        run: |
          set -euo pipefail
          APPTAINER="${SCITEX_CI_APPTAINER:?SCITEX_CI_APPTAINER not set (repo Actions Variable)}"
          APPTAINER="${APPTAINER/#\~/$HOME}"
          [ -x "$APPTAINER" ] || { echo "::error::apptainer shim not executable at $APPTAINER"; exit 1; }
          echo "$(dirname "$APPTAINER")" >> "$GITHUB_PATH"

      - name: Install newb (pinned)
        if: steps.guard.outputs.enabled == 'true'
        # Pinned for reproducibility. Bump in a coordinated PR across
        # the ecosystem so all packages exercise the same newb version.
        # uv venv, not system pip: no python on the bare node, and its system
        # python is PEP-668 externally-managed.
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python 'newb==0.25.0'

      - name: Show newb version + resolved image
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          .venv/bin/newb --version
          apptainer --version
          .venv/bin/python -c "from newb._container_runner import _default_image; print('image:', _default_image())"

      - name: Run newb (verbose so the log shows per-prompt timing)
        if: steps.guard.outputs.enabled == 'true'
        env:
          NEWB_ANTHROPIC_API_KEY: ${{ secrets.NEWB_ANTHROPIC_API_KEY }}
          # Resource caps so an attacker who hijacked the docs-reading
          # agent can't DoS via memory/pid exhaustion. Generous enough
          # for pip wheel-building (~1-2 GB transient peak).
          NEWB_HARDEN_MEMORY: 4g
          NEWB_HARDEN_PIDS_LIMIT: 512
          NEWB_HARDEN_CPUS: "2"
          # ghcr credentials for apptainer's docker:// pull. Replaces the old
          # `docker login` step — there is no docker on this node.
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep apptainer's image cache + scratch OFF the operator's home.
          # This is a PERSISTENT self-hosted runner: $HOME is the OPERATOR'S
          # REAL HOME. Apptainer defaults its cache to ~/.apptainer/cache, so
          # an unredirected pull would write multi-GB OCI layers straight into
          # it, every week, forever.
          export APPTAINER_CACHEDIR="$RUNNER_TEMP/apptainer-cache"
          export APPTAINER_TMPDIR="$RUNNER_TEMP/apptainer-tmp"
          mkdir -p "$APPTAINER_CACHEDIR" "$APPTAINER_TMPDIR"
          .venv/bin/newb . --runtime apptainer --json -vv > newb-report.json

      - name: Upload report
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: newb-report
          path: newb-report.json
          if-no-files-found: warn

      - name: Render markdown summary into the run summary
        if: success() && steps.guard.outputs.enabled == 'true'
        run: |
          .venv/bin/python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, newb
          with open("newb-report.json") as f:
              report = json.load(f)
          print(newb.render_markdown(report))
          PY
