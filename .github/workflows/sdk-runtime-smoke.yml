name: SDK runtime smoke

# End-to-end smoke test for the claude-session runtime.
#
# Spawns the in-repo sdk-test agent against a real claude-agent-sdk
# call and asserts the assistant produces the expected exact-string
# output. Distinct from haiku-integration.yml (which exercises the
# legacy `claude` CLI path with its tmux + auto-accept stack and
# can't pass on a vanilla runner because of the first-run OAuth
# requirement). The SDK reads ANTHROPIC_API_KEY directly so a clean
# GH runner is sufficient — no browser OAuth, no ~/.claude/ seeding.
#
# Triggers:
#   * push to develop / main — gates merges with a real-network proof
#     that the SDK runtime works end-to-end.
#   * pull_request — same proof for incoming work, but only when the
#     PR is internal (forks can't read the secret; we skip cleanly).
#   * workflow_dispatch — manual rerun.
#   * cron (daily 07:00 UTC) — catches upstream SDK breakage between
#     code changes.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-smoke:
    # Forks can't read repo secrets — skip rather than fail with a
    # spurious "missing key" error message.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Sac-namespaced auth handoff. The runner inside the container
      # translates SAC_ANTHROPIC_API_KEY to ANTHROPIC_API_KEY at the
      # SDK transport boundary (see _sdk_common.provision_anthropic_auth).
      # Use the API-key form (sk-ant-api-*) because OAuth tokens
      # (sk-ant-oat-*) aren't valid via a bare ANTHROPIC_API_KEY env.
      SAC_ANTHROPIC_API_KEY: ${{ secrets.SCITEX_AGENT_CONTAINER_CI_ANTHROPIC_API_KEY }}

    steps:
      - name: Fail early if SAC_ANTHROPIC_API_KEY is unset
        run: |
          if [ -z "$SAC_ANTHROPIC_API_KEY" ]; then
            echo "::error::SAC_ANTHROPIC_API_KEY is unset (CI secret missing?)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify project-local discovery picks up sdk-test
        # Read-only sanity check before paying the SDK call: the
        # project-scope walk MUST resolve the in-repo agent. If this
        # fails the smoke step below would hit a confusing
        # "agent not found" later.
        run: |
          python - <<'PY'
          from scitex_agent_container.config._resolve import resolve_config
          path = resolve_config("sdk-test")
          print("resolved:", path)
          assert ".scitex/agent-container/agents/sdk-test/sdk-test.yaml" in path, path
          PY

      - name: Build sdk-persistent image
        run: |
          set -euo pipefail
          sac image build --target sdk-persistent --yes

      - name: Run sdk-test as daemon and tail docker logs
        run: |
          set -euo pipefail
          sac agent start sdk-test
          # Wait up to 90s for the agent to print the expected token to
          # docker logs. The container exits cleanly once the SDK reply
          # arrives (restart policy: never), so we poll docker logs
          # rather than re-attaching to a TTY.
          deadline=$(( $(date +%s) + 90 ))
          cid_file=.scitex/agent-container/runtime/sdk-test/container_id
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ -f "$cid_file" ]; then
              cid="$(cat "$cid_file")"
              docker logs "$cid" >smoke-out.txt 2>&1 || true
              if grep -q "sdk-runtime-ok" smoke-out.txt; then
                echo "found sdk-runtime-ok"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::timed out waiting for 'sdk-runtime-ok'"
          [ -f smoke-out.txt ] && cat smoke-out.txt
          exit 1

      - name: Show transcript + quota for visibility
        if: always()
        run: |
          echo "=== session.jsonl ==="
          cat .scitex/agent-container/runtime/sdk-test/session.jsonl || true
          echo "=== quota.json ==="
          cat .scitex/agent-container/runtime/sdk-test/quota.json || true
          echo "=== heartbeat.json ==="
          cat .scitex/agent-container/runtime/sdk-test/heartbeat.json || true

      - name: Upload transcript artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-runtime-state-${{ github.run_id }}
          path: |
            .scitex/agent-container/runtime/sdk-test/
            smoke-out.txt
          if-no-files-found: ignore
