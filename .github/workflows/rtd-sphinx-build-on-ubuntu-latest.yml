name: docs

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sphinx:
    name: rtd-sphinx-build-on-ubuntu-latest
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'
      docs_dir: docs/sphinx
      fail_on_warning: ${{ github.event_name == 'pull_request' }}
      bundle_dir: src/scitex_agent_container/_sphinx_html
