name: docs

# Sphinx HTML build + refresh of the bundled src/scitex_agent_container/
# _sphinx_html/ snapshot. (Local `sphinx-build` smoke check — ReadTheDocs
# itself builds independently from its own webhook.)
#
# RUNNER (operator rule 2026-07-14, absolute, no exceptions): NO GitHub-hosted
# runners anywhere in this repo. If Spartan misbehaves, that is OURS to fix —
# never fall back to a hosted runner.
#
# WHAT ubuntu-latest WAS HIDING HERE: `pip install -e ".[docs]"` onto the
# runner's SYSTEM python. On Spartan that dies twice over — no Python on the
# bare node (actions/setup-python fails "version 3.x not found for this OS")
# and a PEP-668 externally-managed system python (pip refuses with
# `externally-managed-environment`). Same class of latent breakage as lint and
# quality: the step never worked, it was carried by the hosted image.
#
# NOTE this job does NOT call the org reusable
# (scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml). That reusable
# probes for conf.py at docs/, docs/source/ and docs/src/ ONLY — sac's lives at
# docs/sphinx/conf.py, so the reusable would have found nothing, printed
# "no sphinx conf.py — skipping" and exited 0. It would have converted this
# gate into a GREEN NO-OP. Consolidate only after teaching it that path.
#
# `sphinx-build` is invoked as the CONSOLE SCRIPT (not `python -m sphinx`) so
# the scitex-dev auditor's PS-122 still detects that this workflow runs it.

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  sphinx:
    # Kept byte-identical — see lint.yml. (Verified: not protection-pinned.)
    name: rtd-sphinx-build-on-ubuntu-latest
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: pyproject.toml

      - name: Install package + docs deps
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[docs]"

      - name: Build Sphinx HTML (warnings fail PRs only)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            .venv/bin/sphinx-build -W -b html docs/sphinx docs/sphinx/_build/html
          else
            .venv/bin/sphinx-build -b html docs/sphinx docs/sphinx/_build/html
          fi

      - name: Refresh src/scitex_agent_container/_sphinx_html/ (push to default branch only)
        if: github.event_name == 'push'
        run: |
          rm -rf src/scitex_agent_container/_sphinx_html
          cp -rf docs/sphinx/_build/html src/scitex_agent_container/_sphinx_html
          # ``.doctrees/`` is Sphinx's internal pickled-AST cache —
          # not part of the published HTML. The binary
          # ``environment.pickle`` is what made every release's
          # sync-main fast-forward fail with merge conflicts on
          # develop ↔ main. Strip it before committing so the two
          # branches never carry divergent binaries.
          rm -rf src/scitex_agent_container/_sphinx_html/.doctrees
          touch src/scitex_agent_container/_sphinx_html/.nojekyll

      - name: Commit refreshed HTML if it changed
        continue-on-error: true
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain src/scitex_agent_container/_sphinx_html)" ]; then
            # `git config` WITHOUT --global, deliberately. On a PERSISTENT
            # self-hosted runner $HOME is the OPERATOR'S REAL HOME — a
            # `--global` write here would edit the operator's live ~/.gitconfig
            # on every single docs build. Repo-local config stays inside the
            # workspace and is discarded with it.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/scitex_agent_container/_sphinx_html
            git commit -m "docs: refresh _sphinx_html/ from CI build [skip ci]"
            git push
          fi
