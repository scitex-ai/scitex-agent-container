# SciTeX ecosystem quality audit.
#
# Runs weekly (Mondays 06:00 UTC) and on every push to main/develop.
# Warn-only by default: the job surfaces violations in the Actions summary
# but does not fail the build. Flip `continue-on-error: false` on individual
# steps once each audit is clean and you want the gate enforced.
#
# Rules checked:
#   - audit-cli          noun-verb convention for Click subcommands
#   - audit-frontmatter  YAML frontmatter on every _skills/*.md (FM-0..FM-6)
#   - audit-docs         drift between SKILL.md examples and real code
#   - audit-lines        per-file line-count allowlist
#   - audit-scope        public API covered by tests
#
# RUNNER (operator rule 2026-07-14, absolute, no exceptions): NO GitHub-hosted
# runners anywhere in this repo. If Spartan misbehaves, that is OURS to fix —
# never fall back to a hosted runner.
#
# WHAT ubuntu-latest WAS HIDING HERE: this job's install step was
# `pip install -e .` straight onto the runner's SYSTEM python. That works on a
# hosted image and is a HARD FAILURE on Spartan two ways over — the bare node
# has no Python at all (so actions/setup-python@v4 fails "version 3.x not found
# for this OS"), and its system python is PEP-668 externally-managed (so pip
# would refuse with `externally-managed-environment`). The step only ever
# "passed" because a hosted image handed it a writable system python.
#
# THE FIX is the pattern the org-level reusables already run GREEN on
# spartan-cpu: astral-sh/setup-uv (a JS action — fine on self-hosted) +
# `uv venv --python 3.12`, which fetches uv's OWN managed CPython into the
# workspace. Everything installs into that venv, never into system site.
name: quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    # Deliberate misnomer, kept byte-identical — see lint.yml for the full
    # reasoning. (Verified: not a protection-pinned required context.)
    name: scitex-dev-quality-audit-on-ubuntu-latest
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: pyproject.toml

      - name: Install package + scitex-dev audit extras
        continue-on-error: true
        run: |
          set -uo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e . || true
          # Prefer PyPI (public); fall back to git for unreleased audit features.
          # Both lines are tolerant — the audit steps below are
          # continue-on-error so a missing scitex-dev surfaces in the
          # summary rather than blocking the build.
          uv pip install --python .venv/bin/python "scitex-dev[cli-audit]" || \
            uv pip install --python .venv/bin/python "scitex-dev[cli-audit] @ git+https://github.com/ywatanabe1989/scitex-dev.git@main" || \
            true
          # Put the venv on PATH for every SUBSEQUENT step, so both `python`
          # and the `scitex-dev` console script (plus the subcommands audit-all
          # spawns) resolve to the venv rather than to a node python that does
          # not exist.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Detect package name
        id: pkg
        run: |
          pkg=$(python -c "import tomllib,sys; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['name'])")
          echo "name=$pkg" >> "$GITHUB_OUTPUT"
          echo "import_name=$(echo $pkg | tr - _)" >> "$GITHUB_OUTPUT"

      - name: audit-cli
        continue-on-error: true
        run: scitex-dev quality audit-cli ${{ steps.pkg.outputs.name }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: audit-frontmatter
        continue-on-error: true
        run: |
          skills_dir="src/${{ steps.pkg.outputs.import_name }}/_skills"
          [ -d "$skills_dir" ] && scitex-dev quality audit-frontmatter "$skills_dir" | tee -a "$GITHUB_STEP_SUMMARY" || echo "no _skills dir, skipping" >> "$GITHUB_STEP_SUMMARY"

      - name: audit-docs
        continue-on-error: true
        run: scitex-dev quality audit-docs ${{ steps.pkg.outputs.name }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: audit-lines
        continue-on-error: true
        run: scitex-dev quality audit-lines | tee -a "$GITHUB_STEP_SUMMARY"

      - name: audit-scope
        continue-on-error: true
        run: scitex-dev quality audit-scope ${{ steps.pkg.outputs.name }} | tee -a "$GITHUB_STEP_SUMMARY"
