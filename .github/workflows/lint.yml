name: lint

# Mirror of the local pre-push lint gate (.githooks/pre-push). Both run
# ruff strictly (no --fix), so a push that bypassed the local hook
# (--no-verify, missing ruff, fresh clone w/o scripts/install-pre-push-hook.sh)
# still fails on the remote.
#
# Scope: --select F401,F811 only (unused-import + redefinition). The
# broader pyproject.toml ruleset ([E, F, W, I]) has ~100 pre-existing
# violations across the tree — flipping it on wholesale would block
# every push. Tighten the --select set once those are triaged. The
# motivating risk (F401 slip-through after the edit-hook stopped
# autofixing imports) is fully covered here.
#
# --extend-per-file-ignores excludes __init__.py re-export shims (the
# standard idiom — imports there *are* the public surface, not dead code).
#
# RUNNER (operator rule 2026-07-14, absolute, no exceptions): NO GitHub-hosted
# runners anywhere in this repo. If Spartan misbehaves, that is OURS to fix —
# never fall back to a hosted runner.
#
# WHY NOT actions/setup-python: the bare Spartan node has NO Python and no
# Python tool cache; that action fails there ("version 3.x not found for this
# OS"). And the node's system python is PEP-668 externally-managed, so the old
# `pip install ruff` would have died with `externally-managed-environment` even
# if a python HAD existed. Two independent breakages, one fix.
#
# THE FIX is the pattern the org-level reusables already run GREEN on
# spartan-cpu (scitex-plt / scitex-scholar / scitex-todo / scitex-ssh):
# astral-sh/setup-uv (a JS action — runs fine on self-hosted, same class as
# actions/checkout) + `uv venv --python 3.12`, which fetches uv's OWN managed
# CPython into the workspace. That sidesteps "no python on the node" AND
# PEP 668 together. No SIF needed for a job this light — the SIF exists to
# supply the heavy test dep tree, which ruff does not need.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ruff:
    # THE NAME IS A DELIBERATE MISNOMER — DO NOT "FIX" IT IN PASSING.
    # Verified against branch protection on BOTH develop and main: the only
    # required contexts are pytest-matrix-on-ubuntu-py3.{11,12,13}, so this
    # name is NOT protection-pinned and *could* be renamed safely. It is kept
    # byte-identical anyway: renaming buys nothing, and a required check that
    # stops reporting has already held a release hostage once. Correcting the
    # "on-ubuntu" names repo-wide is a separate, coordinated change.
    name: ruff-on-ubuntu-latest
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: pyproject.toml

      - name: Ruff check
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python ruff
          .venv/bin/ruff check \
            --select F401,F811 \
            --extend-per-file-ignores '**/__init__.py:F401' \
            src/ tests/
