name: lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff-on-ubuntu-latest
    uses: scitex-ai/.github/.github/workflows/organization-job.yml@main
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'
      command: |
        set -euo pipefail
        UV=/uvwork/bin/uv
        if [ ! -x "$UV" ]; then UV=uv; fi
        "$UV" tool run --from ruff ruff check --select F401,F811 --extend-per-file-ignores '**/__init__.py:F401' src/ tests/
        "$UV" tool run --from ruff ruff check --select T201,T203 src/
