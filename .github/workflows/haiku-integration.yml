name: Haiku integration tests

# End-to-end tests that spawn a real Claude Code agent backed by
# haiku and run the nonce-probe + compact paths against it.
#
# STATUS: manual-only. Claude Code 2.1.x's first-run flow on a clean
# HOME requires browser-based OAuth even when ANTHROPIC_API_KEY is
# set in env, so a fresh GH runner can't complete auth. Until we
# pre-seed ~/.claude/.credentials.json on the runner, the nightly
# cron would just burn budget on skipped runs.
#
# Run these tests locally (where the dev's ~/.claude/.credentials.json
# is already populated by `claude /login`):
#
#     python -m pytest --rootdir=. tests/test_haiku_integration.py -v -m integration
#
# Re-enable the nightly cron once the CI auth path is sorted.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  haiku-integration:
    # Skip on PRs (forks can't read the secret anyway, but be
    # explicit so internal PRs also skip unless manually dispatched).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Sac-namespaced CI key (single name across local + CI + container).
      # The Haiku integration test's _auth_available() reads this first
      # and re-exports it as ANTHROPIC_API_KEY so the `claude` CLI picks
      # it up.
      SAC_ANTHROPIC_API_KEY: ${{ secrets.SAC_ANTHROPIC_API_KEY }}

    steps:
      - name: Fail early if the secret is missing
        run: |
          if [ -z "${SAC_ANTHROPIC_API_KEY}" ]; then
            echo "::error::secret SAC_ANTHROPIC_API_KEY is not set."
            echo "Set it via:"
            echo "  gh secret set SAC_ANTHROPIC_API_KEY --repo <owner>/<repo>"
            echo "Or rotate from your local OAuth (~/.claude/.credentials.json):"
            echo "  sac dev rotate-github-secrets --yes"
            exit 1
          fi
          echo "secret present (len=${#SAC_ANTHROPIC_API_KEY})"

      - uses: actions/checkout@v4

      - name: Install system deps (tmux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V

      - name: Install Node + Claude Code CLI
        run: |
          sudo apt-get install -y --no-install-recommends nodejs npm
          node --version
          npm --version
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package (with test extras if available)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' || python -m pip install -e .
          python -m pip install pytest pytest-timeout

      - name: Run Haiku integration tests
        run: |
          python -m pytest tests/test_haiku_integration.py \
              -v -m integration --timeout=240
