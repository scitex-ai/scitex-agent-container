# Agent-independent CI watcher (see src/scitex_agent_container/_lifecycle/_ci_watcher.py).
# The poll leg runs GitHub-hosted, never self-hosted.
#
# Two defects kept every scheduled run red from the day this landed:
#   1. `actions/checkout` of `ref: ci-watch-ledger` fails when that branch does
#      not exist, and nothing ever created it. The ledger is now opened by
#      `.github/ci/open_ci_watch_ledger.sh`, which fetches the branch or, on
#      the first run, starts it as an orphan so the push below creates it.
#   2. On `schedule` there are no inputs, so the poll ran with an empty
#      RUN_ID. A scheduled tick now watches the newest `ci` run on develop;
#      `workflow_dispatch` can still name any repo/run explicitly.
# The poll also imported the package without installing it; the watcher
# module is stdlib-only, so it is loaded by path instead.
name: ci-watch
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/repo to poll"
        default: "scitex-ai/scitex-agent-container"
        required: true
      run_id:
        description: "workflow run id to poll (empty = newest ci run on develop)"
        required: false
permissions:
  contents: write # to append the ledger branch
  actions: read # to resolve and read the watched run
concurrency:
  # Two ticks appending to the same ledger branch only fight over the push.
  group: ci-watch-ledger
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest # GitHub-hosted: independent of self-hosted runners AND agents
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Open the ledger branch
        run: bash .github/ci/open_ci_watch_ledger.sh ledger
      - name: Resolve the run to watch
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ inputs.repo || github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "$REPO" --workflow ci --branch develop \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::no ci run on develop to watch in $REPO"
            exit 1
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Poll target run and append ledger row
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.target.outputs.repo }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import importlib.util
          import os

          spec = importlib.util.spec_from_file_location(
              "_ci_watcher", "src/scitex_agent_container/_lifecycle/_ci_watcher.py"
          )
          w = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(w)
          repo, run_id = os.environ["REPO"], os.environ["RUN_ID"]
          row = w.poll_once("ledger/ci-watch.jsonl", repo=repo, run_id=run_id)
          print("recorded:", row["run_id"], row["status"], row["recorded_at"])
          print("health:", w.health("ledger/ci-watch.jsonl", repo=repo, run_id=run_id))
          PY
      - name: Push ledger row
        env:
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          bash .github/ci/push_ci_watch_ledger.sh ledger ci-watch.jsonl "ci-watch: poll $RUN_ID"
  host-load:
    # LAN-bound observer: ssh to scitex-compute-02/03/04 is unreachable from
    # GitHub-hosted runners, so this leg MUST run self-hosted. It never gates
    # anything (continue-on-error, no `needs` edge either way): the
    # agent-independent poll above survives a dead runner pool and vice versa.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Open the ledger branch
        run: bash .github/ci/open_ci_watch_ledger.sh ledger
      - name: Probe compute-host load and append ledger row
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ inputs.repo || github.repository }}
        run: |
          repo="$REPO"
          queued=false
          for st in queued in_progress; do
            n=$(gh api "repos/$repo/actions/runs?per_page=1&status=$st" --jq '.total_count' 2>/dev/null)
            [ "${n:-0}" -gt 0 ] && queued=true
          done
          export QUEUED="$queued"
          python3 - <<'PY'
          import importlib.util
          import os

          spec = importlib.util.spec_from_file_location(
              "_ci_watcher", "src/scitex_agent_container/_lifecycle/_ci_watcher.py"
          )
          w = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(w)
          row = w.poll_host_loads_once(
              "ledger/ci-watch-host-load.jsonl", queued=os.environ["QUEUED"] == "true"
          )
          print("hosts:", {h: (s.get("idle", "error") if isinstance(s, dict) else "error") for h, s in row["hosts"].items()})
          print("idle_while_queued:", row["idle_while_queued"], row["recorded_at"])
          PY
      - name: Push host-load row
        run: |
          bash .github/ci/push_ci_watch_ledger.sh ledger ci-watch-host-load.jsonl "ci-watch: host-load"
