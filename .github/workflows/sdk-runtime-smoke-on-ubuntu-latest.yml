name: sdk-runtime-smoke-on-ubuntu-latest

# End-to-end smoke test for the claude-session runtime.
#
# Spawns the in-repo sdk-test agent against a real claude-agent-sdk
# call and asserts the assistant produces the expected exact-string
# output. Distinct from haiku-integration.yml (which exercises the
# legacy `claude` CLI path with its tmux + auto-accept stack and
# can't pass on a vanilla runner because of the first-run OAuth
# requirement). The SDK reads ANTHROPIC_API_KEY directly so a clean
# GH runner is sufficient — no browser OAuth, no ~/.claude/ seeding.
#
# Triggers:
#   * push to develop / main — gates merges with a real-network proof
#     that the SDK runtime works end-to-end.
#   * pull_request — same proof for incoming work, but only when the
#     PR is internal (forks can't read the secret; we skip cleanly).
#   * workflow_dispatch — manual rerun.
#   * cron (daily 07:00 UTC) — catches upstream SDK breakage between
#     code changes.

# DISABLED: workflow pre-dates docker/podman ripout (2026-05-13).
# Uses --target sdk-persistent (flag removed), docker run/logs (runtime gone),
# and apptainer is not available on ubuntu-latest runners.
# Re-enable once rewritten for apptainer-only world.
on:
  workflow_dispatch:
    inputs:
      _disabled:
        description: "Workflow disabled — see comment above"
        required: false

permissions:
  contents: read

jobs:
  sdk-smoke:
    name: sdk-runtime-smoke-on-ubuntu-latest
    # Forks can't read repo secrets — skip rather than fail with a
    # spurious "missing key" error message.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Auth — two complementary paths, whichever is set wins:
      #
      #   * ``SAC_ANTHROPIC_API_KEY`` — bare env, works for real
      #     ``sk-ant-api*`` keys (pay-per-token). Anthropic REJECTS
      #     ``sk-ant-oat*`` OAuth tokens passed this way without
      #     refresh-token / expiresAt context.
      #   * ``SAC_CLAUDE_CODE_CREDENTIALS_JSON`` — full
      #     ``~/.claude/.credentials.json`` content as the env-var
      #     value. ``container.py`` materialises it to a 0644 tempfile
      #     and dual-bind-mounts it into the container at the SDK's
      #     and the bundled CLI's homedir paths. Required for Pro/Max
      #     OAuth (flat-rate).
      #
      # Pattern lifted from newb's working CI (newb 0.26.5+).
      SAC_ANTHROPIC_API_KEY: ${{ secrets.SAC_ANTHROPIC_API_KEY }}
      SAC_CLAUDE_CODE_CREDENTIALS_JSON: ${{ secrets.SAC_CLAUDE_CODE_CREDENTIALS_JSON }}

    steps:
      - name: Fail early if neither auth secret is set
        run: |
          if [ -z "$SAC_ANTHROPIC_API_KEY" ] && [ -z "$SAC_CLAUDE_CODE_CREDENTIALS_JSON" ]; then
            echo "::error::Neither SAC_ANTHROPIC_API_KEY nor SAC_CLAUDE_CODE_CREDENTIALS_JSON secret is set."
            echo "Push one with:"
            echo "  sac dev upload-apikey-from-credentials-to-github --yes  # api-key path"
            echo "  sac dev upload-credentials-to-github --yes              # OAuth flat-rate"
            exit 1
          fi
          if [ -n "$SAC_CLAUDE_CODE_CREDENTIALS_JSON" ]; then
            echo "auth: SAC_CLAUDE_CODE_CREDENTIALS_JSON set (OAuth flat-rate; container.py will mount tempfile)"
          else
            echo "auth: SAC_ANTHROPIC_API_KEY only (api-key path)"
          fi

      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify project-local discovery picks up sdk-test
        # Read-only sanity check before paying the SDK call: the
        # project-scope walk MUST resolve the in-repo agent. If this
        # fails the smoke step below would hit a confusing
        # "agent not found" later.
        run: |
          python - <<'PY'
          from scitex_agent_container.config._resolve import resolve_config
          path = resolve_config("sdk-test")
          print("resolved:", path)
          assert ".scitex/agent-container/agents/sdk-test/spec.yaml" in path, path
          PY

      - name: Build sdk-persistent image
        run: |
          set -euo pipefail
          sac image build --target sdk-persistent --yes

      - name: Diagnose container auth state (per newb's advice checklist)
        # Confirms in-container HOME, UID, /home/agent/.claude perms,
        # and that ANTHROPIC_API_KEY is NOT set in the container env
        # — the four diagnostic checks newb's advice file documents
        # in priority order. Output goes to the run log so the next
        # CI failure (if any) names the failing check directly.
        run: |
          set -euo pipefail
          cat > /tmp/diag-creds.json <<'JSON'
          {"claudeAiOauth":{"accessToken":"sk-ant-oat-DIAG","refreshToken":"DIAG","expiresAt":9999999999000,"scopes":[],"subscriptionType":"max"}}
          JSON
          chmod 644 /tmp/diag-creds.json
          docker run --rm \
            -v /tmp/diag-creds.json:/home/agent/.claude/.credentials.json \
            --entrypoint bash \
            scitex-agent-container:sdk-persistent -c '
              echo "=== container state ==="
              echo "HOME=$HOME"
              echo "USER=$(id -un):$(id -u):$(id -g)"
              echo "ANTHROPIC_API_KEY set: ${ANTHROPIC_API_KEY:+yes}${ANTHROPIC_API_KEY:-no}"
              echo "SAC_ANTHROPIC_API_KEY set: ${SAC_ANTHROPIC_API_KEY:+yes}${SAC_ANTHROPIC_API_KEY:-no}"
              echo "=== /home/agent/.claude/ ==="
              ls -la /home/agent/.claude/ || echo "(missing)"
              echo "=== file readable ==="
              cat /home/agent/.claude/.credentials.json | head -c 80 && echo
            '

      - name: Verify SAC_CLAUDE_CODE_CREDENTIALS_JSON byte-integrity
        # If the bytes that GH delivered to env differ from the local
        # file the upload tool hashed, the SDK will see a mangled
        # credentials.json and fail to auth. Compare against the
        # public SHA256 sidecar variable (uploaded alongside the
        # secret).
        env:
          SIDECAR_SHA: ${{ vars.SAC_CLAUDE_CODE_CREDENTIALS_JSON_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$SAC_CLAUDE_CODE_CREDENTIALS_JSON" ]; then
            echo "no creds env — skipping byte-integrity check"
            exit 0
          fi
          got_sha="$(printf '%s' "$SAC_CLAUDE_CODE_CREDENTIALS_JSON" | sha256sum | awk '{print $1}')"
          got_sha_n="$(printf '%s\n' "$SAC_CLAUDE_CODE_CREDENTIALS_JSON" | sha256sum | awk '{print $1}')"
          got_len="$(printf '%s' "$SAC_CLAUDE_CODE_CREDENTIALS_JSON" | wc -c)"
          echo "expected (sidecar): ${SIDECAR_SHA:-unset}"
          echo "got (no-trailing-LF): $got_sha (len=$got_len)"
          echo "got (with-trailing-LF): $got_sha_n"
          if [ -z "$SIDECAR_SHA" ]; then
            echo "::warning::sidecar variable not set — cannot verify"
          elif [ "$got_sha" = "$SIDECAR_SHA" ] || [ "$got_sha_n" = "$SIDECAR_SHA" ]; then
            echo "byte-integrity: OK"
          else
            echo "::error::byte-integrity mismatch — GH transformed the secret in transit"
          fi

      - name: Run sdk-test as daemon and tail docker logs
        run: |
          set -euo pipefail
          sac agent start sdk-test
          # Wait up to 90s for the agent to print the expected token to
          # docker logs. The container exits cleanly once the SDK reply
          # arrives (restart policy: never), so we poll docker logs
          # rather than re-attaching to a TTY.
          deadline=$(( $(date +%s) + 90 ))
          cid_file=.scitex/agent-container/runtime/sdk-test/container_id
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ -f "$cid_file" ]; then
              cid="$(cat "$cid_file")"
              docker logs "$cid" >smoke-out.txt 2>&1 || true
              if grep -q "sdk-runtime-ok" smoke-out.txt; then
                echo "found sdk-runtime-ok"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::timed out waiting for 'sdk-runtime-ok'"
          [ -f smoke-out.txt ] && cat smoke-out.txt
          exit 1

      - name: Show transcript + quota for visibility
        if: always()
        run: |
          echo "=== session.jsonl ==="
          cat .scitex/agent-container/runtime/sdk-test/session.jsonl || true
          echo "=== quota.json ==="
          cat .scitex/agent-container/runtime/sdk-test/quota.json || true
          echo "=== heartbeat.json ==="
          cat .scitex/agent-container/runtime/sdk-test/heartbeat.json || true

      - name: Upload transcript artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-runtime-state-${{ github.run_id }}
          path: |
            .scitex/agent-container/runtime/sdk-test/
            smoke-out.txt
          if-no-files-found: ignore
