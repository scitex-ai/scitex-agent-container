# ─────────────────────────────────────────────────────────────────────────────
# GitHub-HOSTED runner allowlist — the ONLY sanctioned exceptions.
# ─────────────────────────────────────────────────────────────────────────────
#
# Operator directive, 2026-07-14: GitHub-hosted runners are FORBIDDEN.
# Every job runs on the self-hosted pool. If the pool is broken, that is OUR
# problem to fix — escaping back to a hosted runner is not an option.
#
# AMENDED 2026-08-12. The directive above shipped with the words "mandatory, no
# exceptions" while cla.yml was ALREADY a deliberate exception, so the rule as
# written was never true — and a rule that is visibly false in one place stops
# being believed in the others. The operator amended it on 2026-08-12
# (「nightly で 3.12, 3.13 を pure github で回せばよいかと」). What is true now:
#
#   * Anything a HUMAN WAITS ON — the PR gate, lint, import-smoke, docs — runs
#     on our pool. That half of the rule is unchanged and absolute.
#   * A job nobody waits on MAY run on GitHub's hardware when there is an
#     argument for it, and the argument lives HERE. Two exist today: cla.yml
#     (security — see below) and the nightly 3.12/3.13 matrix (cost).
#
# "No hosted runners, no exceptions" is therefore now spelled "no hosted runners
# outside this file". The enforcement did not change: an entry still needs a
# reason of substance, and a stale entry still fails the guard.
#
# Enforced by `src/scitex_agent_container/_hosted_runner_guard.py`, which runs
#   - as a CI job on the SELF-HOSTED pool
#     (.github/workflows/no-hosted-runners-guard-on-self-hosted.yml),
#   - as a `pre-commit` hook,
#   - as a pytest test against this very repo.
#
# WHY THIS FILE EXISTS AT ALL
# ===========================
# An operator-approved exception that lives only in a chat message and a
# merged PR body is a fact written in one place and believed in another.
# The next agent greps for `ubuntu-latest`, finds cla.yml, reads it as an
# oversight, "fixes" it — and reopens a security hole with the best of
# intentions. So the exception lives HERE, in the mechanism, with its
# argument attached, where the person about to remove it must first read
# why it is there.
#
# THE `reason:` FIELD IS MANDATORY AND MACHINE-ENFORCED.
# The guard FAILS (SAC-CI003) on any entry whose `reason:` is missing or
# shorter than 40 characters. You cannot add an exception without arguing
# for it. The guard also FAILS (SAC-CI004) on a STALE entry — one whose
# workflow is gone, or which no longer has a hosted job — because a dead
# exception is a live loophole: it silently pre-approves whatever that
# file does next.
#
# Adding an entry is a deliberate, reviewable act. Argue for it in the PR.
# ─────────────────────────────────────────────────────────────────────────────

allow:
  - workflow: pytest-matrix-on-ubuntu-py3-11-3-12-3-13.yml
    jobs:
      # ONLY the alarm. The `test` job stays on our pool — it is the PR gate a
      # human waits on, and the half of the directive that is absolute.
      - notify
    # NOT RATIFIED BY THE OPERATOR. Recorded honestly rather than stamped
    # `approved_by: operator` like its neighbours: this entry was written by an
    # agent on 2026-08-12 alongside the alarm it covers, and no human has ruled
    # on it yet. The guard does not machine-check this field, which is exactly
    # why it must not be used to manufacture consent. Ratify or reject it in
    # review; if rejected, the alarm moves to the self-hosted pool and loses the
    # fate-independence argued for below.
    approved_by: UNRATIFIED — proposed by an agent, awaiting operator sign-off
    approved_on: null
    proposed_on: 2026-08-12
    reason: >-
      FATE-INDEPENDENCE — a different argument from the two below, and the
      reason this is not merely a cost trade. Every failure the `notify` job
      exists to announce is a failure OF the self-hosted pool: a wedged runner,
      a saturated queue, a broken ci-cpu.sif, a shim that dies before a single
      test runs. Putting that alarm on the same pool means the outages it most
      needs to report are precisely the ones that prevent it reporting. This is
      not hypothetical: measured 2026-08-12, this exact workflow failed its
      nightly cron on seven consecutive nights (Aug 5-11) on `main`, every leg,
      zero tests executed, dying at `mkdir: cannot create directory '/data'` —
      and told nobody, because it had no alarm at all. Nobody waits on this job,
      it runs for seconds, it holds no slot a PR could use, and it publishes to
      the GitHub issues API rather than touching our infrastructure. If this
      exception is removed, the alarm must still not run on the pool it watches
      — solve it another way rather than migrating it here.

  - workflow: nightly-python-matrix-on-github-hosted.yml
    jobs:
      - test
      - notify
    approved_by: operator
    approved_on: 2026-08-12
    # 「nightly で 3.12, 3.13 を pure github で回せばよいかと」 — the operator,
    # amending the 2026-07-14 directive after being shown that four CPU runners
    # were saturated while three banned Spartan machines sat idle.
    reason: >-
      COST, and it only spends hardware we do not own. Our CPU pool is
      contended — on 2026-08-11/12 every node was saturated by stacked PRs each
      fanning out a three-way python matrix of the heaviest job on the queue —
      and it is being resized this week (the spartan nodes are being re-admitted
      once scitex-dev #575-#578 land), so the argument here is deliberately
      about WHO IS WAITING rather than about how many machines we have: a
      nightly has no waiting human and should not hold a slot a PR could use.
      The pull-request gate now runs the ENDS of the supported range
      (3.11 + 3.13) on our pool, and the one version it brackets past (3.12)
      runs HERE, nightly, on GitHub's hardware — which is free for public repos
      and slow, a trade that is exactly right when nobody is waiting and exactly
      wrong for the PR loop a human sits in front of. The security argument that
      keeps cla.yml hosted does NOT apply in reverse here: this job runs our own
      code from our own repo, so moving it to the self-hosted pool would be safe
      — it would simply spend contended hardware to buy nothing. Do not "fix" it
      by migrating it. If this exception is ever removed, the middle version
      loses its daily coverage and is then tested only on `develop`/`main`
      pushes and at release.

  - workflow: cla.yml
    jobs:
      - CLAssistant
    approved_by: operator
    approved_on: 2026-07-14
    # Operator ruled explicitly on this (案1 / "option 1") after being shown
    # the argument below. This is NOT "we forgot to migrate it".
    reason: >-
      Migrating this one to the self-hosted pool would be STRICTLY WORSE than
      the hole it appears to be. cla.yml is triggered by `issue_comment` and
      `pull_request_target` — both UNAUTHENTICATED triggers that ANY stranger
      can fire simply by commenting on an issue. Neither is covered by the
      fork-PR approval gate (`pull_request_target` is the documented way
      AROUND that gate), and the job runs a THIRD-PARTY action. On the Spartan
      self-hosted runner, $HOME is the operator's REAL home directory, holding
      the fleet's LIVE CREDENTIALS. Migrating cla.yml would therefore let an
      unauthenticated stranger execute third-party code on the crown-jewel node
      by commenting on an issue. It stays on GitHub's disposable hardware,
      where a compromise costs us a throwaway VM instead of the fleet. The
      third-party action is SHA-pinned (not tag-pinned) as the compensating
      control. DO NOT "FIX" THIS BY MIGRATING IT — that is the exact bug this
      allowlist exists to prevent.
