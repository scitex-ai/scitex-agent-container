[build-system]
# Pin hatchling below 1.28 — hatchling >=1.28 emits
# ``Metadata-Version: 2.5`` which the pypa-publish action's bundled
# twine rejects with ``InvalidDistribution: '2.5' is not a valid
# metadata version`` (verified on the v0.21.6 release build,
# workflow run 26728715926). Hatchling 1.27 emits
# ``Metadata-Version: 2.4`` which twine accepts. Re-evaluate this
# pin when pypa/gh-action-pypi-publish ships a newer twine.
requires = ["hatchling<1.28"]
build-backend = "hatchling.build"

[project]
name = "scitex-agent-container"
version = "0.28.0"
description = "Declarative YAML-based framework for defining, managing, and orchestrating AI coding agent instances"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "scitex",
    "agent",
    "container",
    "claude-code",
    "orchestration",
    "yaml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # >=8.2, not >=8.0: the test suite asserts that a ``--json`` command's
    # payload reaches STDOUT ALONE (``CliRunner`` ``result.stdout``), which
    # is only a separate stream from 8.2 on. Before 8.2, ``CliRunner``
    # defaulted to ``mix_stderr=True`` and ``result.stdout`` WAS the merged
    # stream — so those assertions would silently pass on merged output and
    # stop pinning anything. ``mix_stderr`` was removed in 8.2, so no single
    # call spells "stdout only" on both sides of the boundary and a
    # compatibility shim is not possible; the floor has to move instead.
    "click>=8.2",
    "pyyaml>=6.0",
    # Round-trip YAML writer used by ``sac host add/remove/set`` so
    # operator-authored comments + key order in config.yaml survive a
    # sac-side edit. Read paths still use pyyaml (cheaper, no comment
    # bookkeeping).
    "ruamel.yaml>=0.18",
    "rich>=13.0",
    # Two distinct uses:
    #   1. `scitex_config._ecosystem.local_state` — canonical local-state
    #      directory helper (project-scope override + auto runtime/ seed
    #      creation) per scitex-python skill
    #      01_arch_06_local-state-directories.md.
    #   2. Public `PriorityConfig` + `load_dotenv` surface — used by
    #      `runtimes/_apptainer_provider.py` to resolve the provider
    #      auth token via the SciTeX-ecosystem `direct → config → env
    #      → default` cascade (see ADR-0011).
    # v0.3.0 was the release that split public from ecosystem-internal
    # and exposed both surfaces — that is our hard minimum.
    "scitex-config>=0.3.0",
    # 0.3.0 gave sac's source-bundled ``sac image build`` the atomic
    # ``build(...)`` it delegates to (timestamped SIF + stable symlink
    # swap; a failed build leaves the prior image intact) with ``cwd``
    # (build context independent of ``output_dir``), ``image_name``,
    # ``retain`` and a Path return.
    #
    # 0.4.0 is the HARD floor now: ``sac image build --reproducible``
    # calls ``build_reproducible(..., cwd=...)``, and ``cwd`` reached the
    # ROUND-TRIP entry points only in 0.4.0. Against 0.3.0 the call is a
    # TypeError — and were the argument merely dropped, the build would
    # FATAL, because sac's recipes resolve ``%files`` and
    # ``From: ./sac-base.sif`` against the staged context. 0.4.0 also
    # publishes the inner boot symlink the round trip previously left
    # stale. See cli_pkg/_image_repro_build.py.
    "scitex-container>=0.4.0",
    "scitex-logging>=0.1.5",
    "scitex-ssh>=1.0.0",
    # A2A protocol surface — Phase 1 SDK adoption (see GITIGNORED/A2A_MIGRATION.md).
    # `[http-server]` extras pull in starlette + sse-starlette for the
    # JSON-RPC + SSE routes we mount in `a2a/_server.py`.
    "a2a-sdk[http-server]>=1.0.2",
    # Anthropic's official SDK — backs the `claude_session` handler
    # (replaces the legacy `claude_cli` / `claude --print` path).
    "claude-agent-sdk>=0.1.0",
    "uvicorn>=0.27",
    # protobuf 6.x removed FieldDescriptor.label, which a2a-sdk 1.0.x's
    # validate_proto_required_fields still references — pin until upstream
    # adopts the descriptor pool API. See CI failure 2026-04-27.
    "protobuf<6",
]

[project.optional-dependencies]
mcp = [
    # F-CS15: sac MCP server. fastmcp 2.x and 3.x both supported via
    # the safe_mount shim (matches scitex-* package convention).
    #
    # 2.x SUPPORT IS SHIM-BACKED BUT UNTESTED, and saying so is the honest
    # form of this claim. The suite installs [dev], which floors fastmcp at
    # >=3.0 (see the note there and the measurement behind it), so nothing
    # in CI ever exercises the 2.x branch of `mcp_group._list_tools`. The
    # floor stays at 2.0 because the runtime shim really does handle both
    # and narrowing it would break the scitex-* convention for consumers
    # who only want the server — but a 2.x regression here would reach a
    # user before it reached a test.
    #
    # `mcp<2` is NOT an untested claim like the fastmcp floor above: mcp
    # 2.0.0 removes `Server.list_tools`, which `mcp_group._list_tools`
    # probes for and the whole `_mcp` suite calls. Until the 2.x API is
    # supported, admitting it here would ship a server that cannot list
    # its own tools.
    "fastmcp>=2.0,<4",
    "mcp>=1.29,<2",
]
telegram = [
    "claude-code-telegrammer>=0.1.0",
]
notify = [
    # Operator notification surface for the OAuth login-relay (emails the
    # auth URL via `scitex_notification.send_email`). Optional + lazily
    # imported (a clear EmailRelayError is raised if absent), so core install
    # and CI need not resolve it. Agents that use the login-relay install
    # `scitex-agent-container[notify]`. 0.2.9 floor — that is where the public
    # send_email landed.
    "scitex-notification>=0.2.9",
]
slurm = [
    # scitex-hpc 0.5.0 ships Reservation.from_jobid which sac uses to
    # dual-write a Reservation lease alongside its own state on start/stop.
    # Optional: sac's SlurmRuntime works without it (best-effort import).
    "scitex-hpc>=0.6.2",
]
openai = [
    # openai-compat-2: the `openai` harness (spec.harness:
    # openai). Backs `_runners/openai_session.py` (OpenAIAgentsSession — the
    # concrete HarnessSession over Runner.run_streamed + SQLiteSession)
    # and the `openai_session` A2A handler/executor. OPTIONAL on purpose:
    # Claude-only deployments must not pull it — every import is lazy and
    # the handler raises a clear HandlerError when absent. 0.17.4 floor
    # per the card spec (SQLiteSession + FunctionTool surface stable).
    "openai-agents>=0.17.4",
]
codex = [
    # Claude Code stays the harness. scitex-genai supplies the local
    # Anthropic Messages -> ChatGPT Codex subscription bridge selected by
    # `spec.claude.provider: codex`; this is intentionally separate from the
    # `openai` extra above, which replaces the harness with openai-agents.
    # NOT the same thing as `codex-sdk` below — see that extra's comment.
    "scitex-genai[gateway]>=0.1.4",
]
codex-sdk = [
    # sac's FOURTH harness (card sac-codex-python-sdk-harness-20260814):
    # `spec.harness: codex`, backing `_runners/codex_session.py`
    # (CodexSession -- the concrete HarnessSession over AsyncCodex).
    #
    # DELIBERATELY NOT NAMED `codex`: that extra is TAKEN, and by the OTHER
    # axis. `codex` installs scitex-genai for `spec.claude.provider: codex`,
    # an INFERENCE backend with Claude Code still running the loop. THIS
    # extra replaces the HARNESS -- the codex agent program runs the loop
    # and brings its own file-edit/exec/apply_patch tooling. `codex` is the
    # first value to land on both axes, so the two extras are spelled
    # differently rather than one silently shadowing the other.
    #
    # WEIGHT WARNING: openai-codex pins `openai-codex-cli-bin`, a wheel-only
    # package shipping a ~285 MB native `codex` binary (plus rg, bwrap, zsh).
    # OPTIONAL so a BARE install stays Claude-only -- every import is lazy and
    # CodexSession raises CodexSessionError with this install hint when absent.
    # It IS still reachable from `[all]`, as PS-221 §3 requires of every public
    # extra; see the note there. 0.144.4 floor: the first release carrying the
    # AsyncCodex/thread_resume surface the runner is written against.
    "openai-codex>=0.144.4",
]
dev = [
    # PS-210 §2 (dev-extras-incomplete): `[codex-sdk]` declares
    # openai-codex, `src/.../_runners/codex_session.py` imports the
    # `openai_codex` module, and the tests import `scitex_agent_container`
    # — the rule's TRANSITIVE arm — so `[dev]` must carry it too. The
    # rule's contract is that a fresh `pip install -e .[dev]` runs the
    # FULL suite with nothing skipped.
    #
    # NAMED DIRECTLY, NOT AS `scitex-agent-container[codex-sdk]`. That
    # self-referential form is what pip would resolve, but PS-210 reads
    # `[dev]`'s entries as DISTRIBUTION NAMES — `_strip_version` truncates
    # each one at the first `[`, so the self-extra registers as
    # `scitex_agent_container` and the auditor never resolves the extra to
    # `openai_codex`. It was tried (25fe8a37) and the rule still fired.
    # Spelling the distribution out is both what the rule asks for and
    # what the `scitex-hpc` entry below already does for the same reason.
    #
    # The rule's other remedy — `pytest.importorskip("openai_codex")` —
    # is WRONG here and must not be substituted: the tests that mention
    # the module assert the SDK-ABSENT behaviour (CodexSession must be
    # constructible without it, and start() must raise CodexSessionError
    # carrying the pip hint) by forcing `sys.modules["openai_codex"] =
    # None`. importorskip would skip exactly the tests whose whole subject
    # is the absence, i.e. delete the coverage instead of enabling it.
    #
    # Costs nothing in CI, which installs `[all,dev]` and already gets
    # this via `all` (PS-221 §3). It does add openai-codex-cli-bin's
    # ~285 MB native wheel to a bare `[dev]` install. Floor kept in step
    # with the `[codex-sdk]` extra above.
    "openai-codex>=0.144.4",
    # 0.31.1 floor — LOAD-BEARING, do not lower. `audit_all_for_package`
    # first gained its `path=` parameter in 0.31.1 (verified against the
    # published wheels: 0.31.0 has NEITHER `path=` NOR the CWD-git-root
    # fallback; 0.31.1 has both). tests/develop/test_audit.py passes
    # `path=` so the audit grades THIS checkout instead of resolving a
    # tree by guessing — whose last resort is a `~/proj/<name>` guess that
    # lands on the operator's real dev checkout on the Spartan runner.
    # Below 0.31.1 that call raises TypeError, and on 0.31.0-and-older the
    # home-disk guess is the ONLY fallback (no CWD net at all).
    #
    # Prior 0.17.12 floor, still subsumed: scitex-dev 0.16.0 introduced a
    # TypeError in `_check_bridge_pattern` that fires through `ecosystem
    # audit-all` and reds the `test_audit_all_clean` gate; fixed by
    # 0.17.12. Also: tests/results/ accepted as a known tests subdir
    # (PS-302).
    #
    # <0.48 CEILING — REINSTATED 2026-08-12 by the run that tried to lift
    # it. PR #1014 removed this line and put 0.48.0 through CI for the
    # first time; the numbers are recorded here rather than the verdict
    # alone, because the next person to reach for the lift deserves the
    # measurement and not a bare "no".
    #
    # A/B ON ONE COMMIT (a12ea769), same tree, same `.scitex/dev` config:
    #   0.47.0  `ecosystem audit-all` exit 0;  suite green (develop runs
    #           31572345560 / 31570905419 on the same code)
    #   0.48.0  `ecosystem audit-all` exit 1;  3 failed / 15415 passed
    #           (pytest-matrix-on-ubuntu-py3.11, run 31575290345)
    #
    # THE THREE LIFT CONDITIONS, AND WHERE THEY ACTUALLY STAND:
    #
    #  1. MIXED NAME SHAPE — ADAPTED IN PRODUCTION, STALE IN ONE TEST.
    #     `_dev_jobs_capability.name_style_for` now READS the installed
    #     CLI (0.48.0 splits install/uninstall `--name X` from
    #     status/enable/disable/start/stop/restart/exec POSITIONAL NAME)
    #     and `build_argv` follows it, so the nine broken sac commands are
    #     fixed. But `test_the_pass_through_forwards_dry_run` still
    #     asserts the literal pre-0.48 argv with `--name`, so it reds
    #     under 0.48.0 while the code it guards is CORRECT. The gate it
    #     protects (`--dry-run` survives the pass-through) has to be
    #     asserted without pinning the name shape: `build_argv(...,
    #     leaf=...)` was added for exactly that and no test uses it yet.
    #
    #  2. WARNING ROUTING — NOT ADAPTED AT ALL.
    #     0.48.0 changed where `scitex_dev.hosts._retired` emits its
    #     WARNING. Under CliRunner it now reaches the REAL stderr (pytest
    #     files it under "Captured stderr setup") instead of click's
    #     isolated stream, so
    #     `test_library_warning_reaches_the_merged_cli_runner_output`
    #     finds nothing in `result.output`. Untouched since the ceiling
    #     went up.
    #
    #  3. PS-226 — THE DECLARED SKIP DOES NOT CLEAR THE EXIT CODE.
    #     The finding that matters most, because #1009 was meant to have
    #     settled it. `.scitex/dev/config.yaml` declares the PS-226
    #     deferral and 0.48.0 HONOURS it in the report:
    #         MASKED INVENTORY: 1 violation(s) masked by 1 declared rule
    #         summary: 0 unmasked error(s) ..., 1 masked by skip-rules
    #     and audit-all STILL EXITS 1, because audit-project keeps the
    #     masked violation in its own `project-structure: 1 error(s)`
    #     tally. A skip rule that suppresses the REPORT but not the STATUS
    #     cannot do the one job it exists for. That is a scitex-dev
    #     defect, not a sac one: scitex-ai/scitex-dev#590.
    #     (The other audit-cli warnings seen on 0.48.0 — §4b CliHelp, §13
    #     `skills` nesting — are NOT new and NOT the cause: 0.47.0 reports
    #     the same two and exits 0. §10w is an import-budget measurement
    #     the runner's slow I/O made unreadable; it claims no verdict.)
    #
    # THE RENAME PS-226 ASKS FOR IS STILL DELIBERATELY NOT DONE.
    # `systemd_unit_name` derives the unit filename from `JobSpec.name`
    # VERBATIM, so renaming does NOT adopt the live
    # `sac.accounts-refresh.timer` — it INSTALLS A SECOND UNIT beside it.
    # That job is the fleet's sole OAuth refresher against a SINGLE-USE
    # refresh token, and two racing refreshers revoke each other
    # fleet-wide. It is a supervised UNIT MIGRATION (stop-old ->
    # remove-old -> install-new -> verify-exactly-one) whose verb and
    # recorded rename live in `_jobs/_migrate/_renames.py` and whose
    # reasoning lives in `_jobs/_names.py`. A red audit rule is
    # survivable; a revoked fleet credential is not.
    #
    # LIFT THIS CEILING by finishing (1)'s test, doing (2), and taking
    # either an upstream fix or the supervised migration for (3) — never
    # by widening the specifier. A specifier stretched until the red goes
    # away is a gate configured so it cannot fail, which is worse than no
    # gate, because the config still lists it and everyone believes it.
    # CEILING LIFTED 2026-08-13, operator authorised ("ガンガンいってください",
    # "遅い方が罪"). Read the block above before widening this further.
    #
    # What the ceiling was NOT protecting against: lifting it does not touch
    # the OAuth refresher. The credential danger the block describes comes
    # ONLY from performing the PS-226 RENAME, which installs a second unit
    # beside the live sac.accounts-refresh.timer and races a single-use
    # refresh token. THAT RENAME IS STILL DELIBERATELY NOT DONE and must not
    # be done as a side effect of this bump.
    #
    # What lifting it costs, all of it red-not-broken: (1) and (2) are the two
    # tests named above, fixed in this same change; (3) was upstream
    # scitex-ai/scitex-dev#590 — a declared skip rule suppresses the report but
    # not the exit status. The block itself ruled that survivable: "A red audit
    # rule is survivable; a revoked fleet credential is not."
    #
    # (3) IS NO LONGER OWED. #590 was root-caused and fixed upstream on
    # 2026-08-13: `fully_masked` tested `not self.unmasked`, which counts
    # WARN-tier findings that provably fail nothing, so warnings vetoed the
    # downgrade and audit-all printed "0 unmasked error(s)" beside exit=1. It
    # now gates on `unmasked_error_count`. Shipped in 0.49.2.
    #
    # Why now: scitex_dev.store ships after 0.48, and sac cannot adopt the
    # fleet store primitive — the whole point of moving state off SQLite —
    # while this specifier excludes it.
    #
    # THE FLOOR IS 0.49.2, NOT 0.31.1, and the difference is not cosmetic.
    # 0.49.0 shipped `scitex_dev.store` with a Postgres backend nothing could
    # use: psycopg appeared in its pyproject only as a COMMENT, and every
    # Postgres READ crashed because the dialect set no row factory while
    # `row_from_db` addresses columns by name. Writes were unaffected — they
    # bind parameters — which is exactly why it survived: the Postgres path had
    # been written to and never read from. A floor that admits 0.49.0 admits a
    # store this package cannot read, so the version that first WORKS is the
    # version this package may depend on.
    #
    # RAISED TO 0.56.6 on 2026-08-25, and the difference is again not
    # cosmetic. Through 0.56.5, Store._append read MAX(seq) ONCE and then
    # inserted, so concurrent writers on a SINGLE node collided on the oplog
    # (origin, seq) primary key with no bounded retry — measured 7/8 and 5/8
    # failures on the two concurrency tests, reproduced three times. The same
    # release also takes a Postgres advisory lock around CREATE TABLE, which
    # races pg_type when several Store() constructors start together. sac has
    # now moved its own state onto this store, so a floor that admits 0.56.5
    # admits silent write loss on exactly the path the migration depends on.
    # The container recipes gate this BY SYMBOL (_SEQ_ALLOCATION_ATTEMPTS) —
    # see apptainer-scitex.def; this specifier is the base layer's half.
    "scitex-dev>=0.56.6",
    # PS210: tests import scitex_hpc unguarded, so [dev] must include it
    # (otherwise `pip install -e .[dev]` can't run the full suite).
    "scitex-hpc>=0.6.2",
    # `sac dev …` (rotate-secret + credential2apikey) imports
    # scitex_git for its gh-secret/variable wrappers + sha256 sidecar.
    # Keeping it in [dev] (not core deps) so a runtime install of sac
    # doesn't pull the gh CLI plumbing — only maintainers / CI rotation.
    "scitex-git>=0.3.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    # A2A v1.0 push-channel work (ADR-0001 commit 1) introduced async
    # tests against the inbox broker. STRICT asyncio mode keeps the
    # marker explicit per test, which matches the rest of the codebase
    # (no implicit-async-on-conftest surprises).
    "pytest-asyncio>=0.23",
    # DECLARED 2026-08-12, AND IT WAS ALWAYS REQUIRED — [dev] simply never said
    # so. `.github/ci/run-in-sif.sh` REFUSES TO RUN THE SUITE unless pytest
    # reports the plugin set {asyncio, xdist, cov, timeout}, and that check has
    # been passing only because the shared ci-cpu.sif happens to supply
    # pytest-timeout transitively through scitex-dev's own environment. The
    # first run of the suite in a CLEAN venv built from this package's own
    # extras (the GitHub-hosted nightly, run 31551320295) therefore aborted
    # immediately: "pytest plugin 'timeout' did NOT load in this environment."
    # Same principle as the PS210 note on scitex-hpc above: if the full suite
    # cannot run from `pip install -e .[dev]`, [dev] is under-declared.
    "pytest-timeout>=2.0",
    "pre-commit>=3.5.0",
    # MCP test surface (tests/scitex_agent_container/_mcp/) imports
    # fastmcp unconditionally; without it the entire _mcp/ suite is
    # collection-skipped on dev boxes. Keeping fastmcp also as a [mcp]
    # extra so runtime installs that only need the MCP server can
    # opt-in without pulling the rest of [dev].
    #
    # PINNED, AND THE PIN THAT MATTERS IS `mcp`, NOT `fastmcp`.
    #
    # `Server.list_tools` is an API of the `mcp` python-sdk, which fastmcp
    # pulls transitively. Neither was pinned, there is no lockfile, and
    # `uv pip install -e .[dev]` re-resolves on every CI run — so the suite
    # was running against whatever the index served that minute. Measured
    # across three runs of the SAME workflow on the same py3.11:
    #
    #   run 32184153812  fastmcp==3.4.7    mcp==1.29.0  ->  17094 passed
    #   run 32185071483  fastmcp==2.14.1   mcp==2.0.0   ->     29 failed
    #   run 32185515... fastmcp==4.0.0b3  mcp==2.0.0   ->     26 failed
    #
    # `fastmcp` moves in both directions across those rows and the outcome
    # does not follow it; `mcp` does. mcp 2.0.0 (2026-07-28) removed
    # `Server.list_tools`, and every failure is that attribute. So the
    # first version of this pin — a `fastmcp>=3.0` floor — named the wrong
    # package: it let 4.0.0b3 in and changed nothing about the failure.
    #
    # `<2` on mcp is the bound the code is actually written against. `<4`
    # on fastmcp keeps the pre-release out of a resolution that has already
    # been observed reaching for one; the floor stays at 3.0 because the
    # TESTS call `server.list_tools()` outright while the SOURCE tolerates
    # more (`cli_pkg/mcp_group._list_tools` branches on hasattr).
    "fastmcp>=3.0,<4",
    "mcp>=1.29,<2",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
# Convenience aggregate matching the README install hint
# (`pip install scitex-agent-container[all]`). Mirrors the union of
# every other extra so users don't have to memorise the matrix.
all = [
    "scitex-agent-container[mcp]",
    "scitex-agent-container[telegram]",
    "scitex-agent-container[notify]",
    "scitex-agent-container[slurm]",
    # `openai` is in [all] so CI (`pip install -e ".[all,dev]"`) exercises
    # the real openai-agents SDK paths; the bare install stays Claude-only.
    "scitex-agent-container[openai]",
    "scitex-agent-container[codex]",
    # PRESENT BECAUSE THE POLICY REQUIRES IT, not because the tests need
    # it. PS-221 §3 (public-extra-not-closed-under-all): every PUBLIC
    # extra must be a subset of `all`, so `pip install <pkg>[all]` really
    # does pull everything public — an extra missing here silently
    # under-installs for anyone who ran the documented "give me
    # everything" install.
    #
    # The cost is real and worth stating: this drags openai-codex, which
    # pins openai-codex-cli-bin — a wheel-only package shipping a ~285 MB
    # native binary — into every `[all,dev]` CI job, and the codex
    # harness's own tests need none of it (they drive hand-rolled
    # HarnessSession stand-ins and assert the missing-SDK path with a
    # sys.modules sentinel). Omitting it was tried and is WRONG: it makes
    # `[all]` a lie. If the CI weight ever needs solving, solve it in the
    # CI install (a narrower extra set for the test job), not by
    # un-closing `all`. Do NOT try a leading-underscore "private extra"
    # either — PEP 508/685 forbids the name outright.
    "scitex-agent-container[codex-sdk]",
    "scitex-agent-container[dev]",
    "scitex-agent-container[docs]",
]

[project.scripts]
scitex-agent-container = "scitex_agent_container.cli:cli_entry_point"
sac = "scitex_agent_container.cli:cli_entry_point"
sac-statusline = "scitex_agent_container.statusline:main"

[project.entry-points."scitex_dev.docs"]
scitex-agent-container = "scitex_agent_container"

[project.entry-points."scitex_dev.skills"]

scitex-agent-container = "scitex_agent_container"

[project.entry-points."scitex_dev.linter.plugins"]
scitex-agent-container = "scitex_agent_container._linter_plugin:get_plugin"

[project.entry-points."scitex_dev.jobs"]
scitex-agent-container = "scitex_agent_container._jobs._jobs_plugin:provide_jobs"

# STX-S001/S003 require @stx.session on a SCRIPT's main(), because a script
# produces DATA and that data needs lineage. `.github/ci/` produces none: it is
# CI plumbing that reads the GitHub Actions API and prints a status report.
# Wrapping it in @stx.session would record a provenance edge for an artefact
# that does not exist, and would make CI tooling import scitex at a point where
# the environment is exactly what is under suspicion.
#
# The list must RESTATE the defaults ("src", "tests", "apps", "config", "docs")
# — this key replaces them, it does not extend them, and dropping one would
# silently start demanding @stx.session of every module under it.
[tool.scitex-linter]
# ".github", not ".github/ci": the linter's is_script() tests `lib_dir in
# path.parts`, so an entry with a separator in it is never a single path
# COMPONENT and can never match. ".github/ci" sat here as a silent no-op —
# it looked configured and exempted nothing, which is the same shape of bug
# as a hooksPath pointing at a directory that does not exist. Nothing under
# .github is a SciTeX session script, so the component-level entry is also
# the honest one.
library_dirs = ["src", "tests", "apps", "config", "docs", ".github"]

# sac's SYSTEM (apt) dependency declarations, aggregated by
# scitex_dev.system_deps.discover_system_deps. sac registered NOTHING here
# until 2026-08-09 while apptainer-base.def hardcoded its apt list — so the
# BASE image bypassed the federation the SCITEX def calls "SSoT — NOT a
# hardcoded list". Declaring them is what makes the list auditable; the
# reason field on each dep is the part that carries the value.
[project.entry-points."scitex_dev.system_deps"]
scitex-agent-container = "scitex_agent_container._system_deps:provide"

# sac's LEAF declaration of multi-host sync semantics, aggregated by
# scitex_dev.store.discover_store_plugins. scitex-dev owns the replication
# PRIMITIVE (oplog, HLC, per-origin cursors, field-level merge); each leaf
# declares what ITS rows mean when two hosts merge them. sac is a leaf here,
# not privileged.
#
# The declaration is the deliverable because sac's existing cross-host path
# is unsafe in a way that is invisible: state_db_export.import_state does
# INSERT OR IGNORE, so a row that CONTRADICTS the local one and a
# byte-identical duplicate both return rowcount 0. The success value is also
# the didn't-happen value, and two hosts can disagree forever with every call
# reporting success.
#
# The classification each schema encodes: an agent's pid/heartbeat is
# PER-HOST truth (two hosts describe two different processes and each is
# right about itself — merging them is the bug), the comms directory and the
# ACL tables are FLEET truth (disagreement is a real conflict), and lineage
# is append-only HISTORY (a merge must never lose a branch).
[project.entry-points."scitex_dev.store.plugins"]
scitex-agent-container = "scitex_agent_container._store_plugin:provide"

# C10 — sac's consumer on scitex-todo's shared card-event bus. When
# scitex-todo's board emits a card-event (commented / created /
# reassigned / status_changed / completed / committed / pushed /
# merged), this callable is invoked in the board's process; it resolves
# the card's owner + collaborators + subscribers and delivers the
# notification to each via the local ``sac listen`` daemon's
# ``/v1/notify`` router endpoint — so a CONTAINERIZED owner-agent (whose
# a2a port is unreachable inbound) still receives it. The consumer
# filters for the card-event kinds and ignores everything else, incl.
# sac's OWN liveness-tick anomaly events on the same bus. Bus-only
# contract: no import of scitex_todo.
# DECLARED IN BOTH GROUPS, and the duplication is the correct migration
# state — not an oversight to tidy up later.
#
# MEASURED 2026-08-20 by scitex-cards: this consumer has NEVER been invoked in
# production. The running notify daemon executes scitex-cards 0.42.0, whose
# `_hooks/_plugins.py` reads `scitex_cards.hooks` and has ZERO references to
# the retired group. sac was registered only under the retired name, so every
# card event was dispatched to an EMPTY SET — succeeded, reported success,
# called nobody. Corroborating symptoms, all explained by that one fact:
#
#     notifyd-liveness.json  last_delivery_at: null   never delivered, ever
#     local inbox            150 rows, all unseen     enqueued, never pushed
#     agents still get cards                          the PULL rail is separate
#
# Nothing anywhere reported a failure. That is the signature of this defect
# class, and scitex-cards' own docstring recorded the identical state on
# 2026-08-17 — the fix shipped in 0.48.0 and has never executed, because the
# unit whose Description reads "supervised so a package upgrade actually
# reaches it" points ExecStart at a hand-made venv that `pip install -U` never
# touches.
#
# WHY BOTH RATHER THAN A MOVE. 0.42.0 (running now) reads only the new group,
# so adding it revives delivery immediately. 0.48.0 reads both and dedupes, so
# nothing double-fires. And leaving the retired entry in place preserves the
# fleet's only registration under that name, which is what lets scitex-cards
# verify the alias actually works when 0.48.0 finally runs — deleting it would
# make "the alias works" indistinguishable from "nobody was left".
#
# THE NAME AND THE DOTTED PATH MUST STAY BYTE-IDENTICAL between the two
# blocks. 0.48.0 dedupes on the tuple `(ep.name, ep.value)`:
#
#     seen  = {(ep.name, ep.value) for ep in current}
#     extra = [ep for ep in retired if (ep.name, ep.value) not in seen]
#
# so renaming the entry or moving the callable on one side only turns the
# alias meant to FIX delivery into a double-delivery bug. A migration is
# exactly when tidying a name is tempting; do not, until the retired block
# goes away entirely.
#
# C10 — sac's consumer on the shared card-event bus. When the board emits a
# card-event (commented / created / reassigned / status_changed / completed /
# committed / pushed / merged), this callable is invoked in the board's
# process; it resolves the card's owner + collaborators + subscribers and
# delivers the notification to each via the local ``sac listen`` daemon's
# ``/v1/notify`` router endpoint — so a CONTAINERIZED owner-agent (whose a2a
# port is unreachable inbound) still receives it. The consumer filters for the
# card-event kinds and ignores everything else, incl. sac's OWN liveness-tick
# anomaly events on the same bus. Bus-only contract: no import of the board
# package.
[project.entry-points."scitex_cards.hooks"]
scitex-agent-container = "scitex_agent_container._listen._card_event_delivery:deliver_card_event"

# The retired spelling, kept deliberately. See the note above: it is the
# fleet's only registration under this group and therefore the only way to
# verify the 0.48.0 alias when it runs. Remove it only once that verification
# has happened and scitex-cards says the group is closed.
[project.entry-points."scitex_todo.hooks"]
scitex-agent-container = "scitex_agent_container._listen._card_event_delivery:deliver_card_event"

# Claude Code hook RULES sac declares about its own surfaces. sac owns the
# rule (they are sac's images being protected) and ships the refusal
# script; scitex-dev discovers this provider and applies the rows
# centrally, exactly as it does for jobs / system_deps / gate — the leaf
# never installs anything itself, and scitex-dev never hardcodes anything
# about apptainer.
#
# The provider imports scitex_dev.hooks LAZILY, so this entry point ships
# and stays inert on a scitex-dev that predates the hooks contract instead
# of breaking import-time metadata (same idiom + same reason as the
# scitex_dev.jobs provider above).
[project.entry-points."scitex_dev.hooks"]
scitex-agent-container = "scitex_agent_container._claude_hooks_plugin:provide_hooks"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-agent-container"
Repository = "https://github.com/ywatanabe1989/scitex-agent-container.git"
Issues = "https://github.com/ywatanabe1989/scitex-agent-container/issues"
Documentation = "https://scitex-agent-container.readthedocs.io"

# scitex-dev audit configuration. Per-package opt-outs sit here per
# scitex-dev's documented precedent (the same [tool.scitex_dev] block
# is read by `is_mcp_parity_exempt` in
# scitex_dev/_cli/audit/_summary/_mcp_parity.py).
[tool.scitex_dev]
# §6 (audit-mcp-tools, Python-API ↔ MCP parity) — exempt by design.
#
# sac's MCP tool surface mirrors its CLI subcommand surface (which in
# turn wraps internal handlers); the public Python API
# (`scitex_agent_container.<noun>.<verb>`) is a thin re-export of the
# SAME handlers, not a 1:1 parent of the MCP tools. The auditor's
# name-derivation algorithm (`<noun>_<verb>` flatten) consequently sees
# 4 "orphan" MCP tools that are real working features with their own
# canonical names:
#
#   * agent_spawn         — in-container spawn → spawn-proxy (ADR-0010).
#                           MCP-only by design; no CLI/Python counterpart.
#   * list_python_apis    — introspection helper. CLI path:
#                           `sac info list-python-apis`. The closest
#                           Python noun is `sac.mcp.list_tools`, which
#                           is a different concept (FastMCP server's
#                           registered tools, not "all Python APIs").
#   * quota_watch         — account-quota watcher. CLI path:
#                           `sac account watch-quota`. The matching
#                           Python noun is `sac.account.watch_quota`
#                           (flattened: `account_watch_quota`) — the
#                           MCP tool's word order is intentionally the
#                           verb-first form that MCP clients read more
#                           naturally.
#   * subagent_get_state  — subagent state introspection. CLI path:
#                           `sac subagent get-state`. There is no
#                           `sac.subagent` noun submodule today; adding
#                           one purely to satisfy the auditor's
#                           name-derivation would be ceremony.
#
# Renaming either the MCP tools or adding the missing noun submodule
# would be a breaking change for MCP clients calling by tool name AND
# would broaden the Python public API surface beyond what sac actually
# intends (sac is a CLI/MCP-first tool, not a Python library — the
# noun-submodule `__all__`s are convenience re-exports for script
# users, not the canonical command surface).
#
# This is the exact shape `mcp_parity_exempt` was designed for; see
# scitex_dev/_cli/audit/_summary/_mcp_parity.py:9-13 ("Some packages
# legitimately expose far more MCP tools than Python-API functions").
mcp_parity_exempt = true

# §6a — per-package env-var prefix allowlist.
#
# scitex-agent-container ships an operator-facing ``SAC_*`` env-var
# surface that pre-dates the SciTeX-ecosystem ``SCITEX_<PKG>_*``
# convention. Operator-authored shell exports, ~/.dotfiles, agent
# spec ``env:`` blocks, and the dotfiles hook ecosystem all reference
# these literal names; renaming them to ``SCITEX_AGENT_CONTAINER_*``
# would break every running deployment without buying any operator-
# visible upside (the brand prefix IS the established operator
# surface, not a noise-silencer for new code that should have used
# the canonical prefix).
#
# Examples of the surface this opts in:
#   * ``SAC_LISTEN_BEARER`` / ``SAC_LISTEN_BASE_URL`` — bus auth +
#     dial address the channel reads at startup.
#   * ``SAC_HOST`` / ``SAC_NAME`` — runtime identity overrides.
#   * ``SAC_ANTHROPIC_API_KEY`` / ``SAC_CHANNEL_AUTO_ACK`` —
#     channel-mode operator toggles.
#   * ``SAC_SSH_CONTROL_DIR`` / ``SAC_PROBE_LOG_ROOT`` /
#     ``SAC_HOST_IDENTITY_PATH`` /
#     ``SAC_LISTEN_POST_ACK_LIVENESS_TIMEOUT_S`` — operations knobs.
#
# ``CODEX_HOME`` is a THIRD-PARTY CONTRACT, not our namespace. It is
# OpenAI Codex's own variable — the way Codex publishes where its
# ``auth.json`` lives — and ``_account/codex_account.py:_auth_path()``
# reads it to find the login Codex actually wrote. Renaming it would
# not move a name into our namespace; it would simply stop reading
# Codex's login, and do so SILENTLY, in the credential path that is
# hardest to test. It belongs in the same category as the universal
# list's ``GH_TOKEN`` / ``OPENAI_`` entries and is listed by EXACT
# NAME (no trailing underscore) so it grants exactly one variable and
# opens no ``CODEX_*`` namespace. Our own override alongside it,
# ``SCITEX_GENAI_CODEX_HOMES``, is already canonically prefixed and
# needs no entry.
#
# Spec: scitex_dev/_cli/audit/_summary/_env_allowlist.py — the entry
# applies "equal-to-stripped or prefix-match", so ``"SAC_"`` matches
# every ``SAC_*`` env var without listing them individually. New
# code that does not need brand-compat MUST still use the canonical
# ``SCITEX_AGENT_CONTAINER_*`` prefix — this allowlist closes the
# audit-cli ERROR on the legacy surface, not on future regressions.
env_allowlist = ["SAC_", "CODEX_HOME"]

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_agent_container"]

# Stamp the commit + a content hash of the tree into the artifact, as
# `_provenance/_build_info.py`. An installed copy has no `.git`, so build
# time is the only moment the identity of the code can be captured — and
# without it `--version` can only echo a declared string that reads the
# same before and after a fix that did not bump the number.
#
# Registered on BOTH targets on purpose. `python -m build` (what release CI
# runs) builds the sdist first, then builds the wheel FROM THE UNPACKED
# SDIST — a temp dir with no `.git`. The sdist hook bakes the real commit;
# the wheel hook then finds that stamp already present and inherits it
# rather than clobbering it with "unknown". Register only the wheel target
# and every published wheel ships an unknown commit.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "src/hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "src/hatch_build.py"

[tool.hatch.build.targets.sdist]
# NEVER ship .git. In a plain clone `.git` is a directory and hatchling
# already drops it — but in a `git worktree` (how every agent checks this
# repo out) `.git` is a FILE holding an absolute `gitdir:` pointer, and it
# sailed straight into the sdist. Verified: a worktree-built sdist
# contained `scitex_agent_container-0.21.13/.git`.
#
# Harmless before this hook existed; a live hazard now. The build stamp
# resolves the commit by reading `.git`, so a packaged pointer lets a build
# from an unpacked sdist follow it back to WHATEVER repo happens to sit at
# that absolute path and bake ITS commit — a wrong-but-confident answer,
# which is the exact failure mode this whole feature exists to abolish.
# Dropping it also forces the wheel-from-sdist build down the `inherited`
# path, which is the one release CI actually takes.
exclude = [".git"]

[tool.hatch.build.targets.wheel.force-include]
"src/scitex_agent_container/cron/post-merge-pull.sh" = "scitex_agent_container/cron/post-merge-pull.sh"
# systemd --user unit TEMPLATES. Shipped in the wheel for the same reason the
# cron script is: they must be reachable from an INSTALLED sac, on a host where
# the repo is not on disk. They are templates with @PLACEHOLDER@s and nothing
# installs them — deploying a unit is an operator action (the listen unit
# brokers host_exec/spawn/restart for every agent). Tracked at all because
# until 2026-07-30 these units existed ONLY as untracked live files under
# ~/.config/systemd/user/ while brokering the whole fleet: no history, no
# review, and gone if the host were rebuilt.
"src/scitex_agent_container/systemd/sac-listen.service.template" = "scitex_agent_container/systemd/sac-listen.service.template"
"src/scitex_agent_container/systemd/sac.accounts-refresh.service.template" = "scitex_agent_container/systemd/sac.accounts-refresh.service.template"
"src/scitex_agent_container/systemd/sac.accounts-refresh.timer.template" = "scitex_agent_container/systemd/sac.accounts-refresh.timer.template"
"src/scitex_agent_container/systemd/README.md" = "scitex_agent_container/systemd/README.md"
# Bundle pyproject.toml + README.md inside the wheel so the
# source-bundled SIF build (cli_pkg/_image_source_build.py) can
# reconstruct a pip-installable source tree from the INSTALLED
# package — needed when sac was installed from a wheel and the
# original repo root is no longer on disk. The .def's ``uv pip
# install /opt/scitex-agent-container-src`` requires pyproject.toml
# at the staging-root, AND README.md alongside it (pyproject's
# ``readme = "README.md"`` makes hatchling read the file at build
# time). stage_build_context resolves both from this bundled copy
# (with a fallback to the editable-install repo root).
"pyproject.toml" = "scitex_agent_container/_bundled/pyproject.toml"
"README.md" = "scitex_agent_container/_bundled/README.md"
# ...and hatch_build.py, for the same reason and no other. The bundled
# pyproject above DECLARES this file
# (``[tool.hatch.build.targets.*.hooks.custom] path = "src/hatch_build.py"``)
# and hatchling resolves that path against the tree being built — which,
# in a SIF build, is the STAGED tree. Ship the pyproject without the hook
# it names and every `sac image build` dies in %post before reading a line
# of source: ``OSError: Build script does not exist: src/hatch_build.py``.
# It lands in the inert ``_bundled/`` data dir (no ``__init__.py``), so it
# is still NOT importable as ``scitex_agent_container.*`` — hatch_build.py's
# own rule (never put an ``import hatchling`` module on the runtime path)
# holds. Bundled ≠ packaged.
"src/hatch_build.py" = "scitex_agent_container/_bundled/hatch_build.py"

[tool.pytest.ini_options]
# THE PACKAGE UNDER TEST IS THIS CHECKOUT, NOT WHATEVER IS INSTALLED.
#
# Without this line a bare `pytest` here imported scitex_agent_container from
# site-packages: pytest only prepends the ROOTDIR (which holds no importable
# package — the code lives under src/), so `import scitex_agent_container` fell
# through to the ambient interpreter's copy. In the agent container that is a
# REAL, non-editable copy in /opt/venv-sac/lib/python3.12/site-packages, and it
# was FOUR RELEASES STALE (0.21.13 vs the tree's 0.21.20).
#
# A worker ran the suite against their PR and got 50/50 PASSED on a package
# that did not contain their PR at all. They only caught it because their
# branch ADDED a file, so collection raised ImportError on something that
# should have existed. A change that only EDITS existing files has no such
# tell — it just goes green, against code nobody wrote.
#
# `pythonpath` is inserted at sys.path[0] (pytest's python_path plugin runs
# tryfirst on pytest_load_initial_conftests), so it beats BOTH site-packages
# and any inherited $PYTHONPATH. That last part is what keeps CI correct: CI
# exports PYTHONPATH="$TMPDIR/site:$PWD/src" (.github/ci/run-in-sif.sh), and
# this line makes the checkout win regardless of what landed in $TMPDIR/site.
#
# Belt AND braces: tests/conftest.py::pytest_sessionstart independently asserts
# that scitex_agent_container.__file__ resolves under <rootdir>/src and ABORTS
# the session otherwise. Deleting this line does not quietly restore the old
# behaviour — it turns the suite red. That is deliberate: the failure mode this
# closes is invisible by construction, so it must not be re-openable in silence.
#
# "." is the rootdir, so rootdir-relative imports (`tests.*`) resolve the same
# way from any cwd.
pythonpath = [".", "src"]

# A RUN THAT LOST ITS PLUGINS MUST SAY SO, NOT INVENT 93 FAILURES.
#
# 2026-08-11: a wide run in an agent container produced 93 failures that were
# ALL `async def` tests, each reading "async def functions are not natively
# supported". The code was fine. The header was the whole story:
#
#     plugins: anyio-4.14.2, scitex-dev-0.47.0        <- broken run
#     plugins: anyio-4.14.2, asyncio-1.4.0, ...       <- same tests, passing
#
# pytest-asyncio was simply not installed in that interpreter. Without it every
# coroutine test is COLLECTED, never awaited, and reported as a failure — so a
# missing dependency is indistinguishable from a code regression, and two
# agents spent the evening attributing it to their own changes.
#
# The cause was environmental, and that class of cause recurs. It began in the
# image: the sac base SIF installed `/opt/scitex-agent-container-src[openai]`,
# NOT `[dev]`, so a fresh container had no pytest and no pytest-asyncio at all
# (measured 2026-08-11: 19 of 20 agent overlays on scitex-compute-04 had
# neither). Each agent hand-installed what it needed into its own persistent
# overlay, so two agents running the same tests legitimately held different
# plugin sets — and different pytest MAJORS.
#
# THAT ROOT CAUSE IS FIXED: apptainer-base.def now installs `[all,dev]`, so a
# pristine container arrives with pytest 8.4.2, pytest-asyncio, pytest-xdist
# and pytest-cov, and this gate never fires there (measured against the
# 2026-08-12 bake: 0 occurrences of "Missing required plugins" in a 925-test
# run, 0 of "async def functions are not natively supported").
#
# The gate is NOT thereby redundant, because the image is only one of the ways
# an interpreter loses a plugin. CI has its own path to the same state:
# .github/ci/run-in-sif.sh falls back `[all,dev]` -> `[dev]` -> `-e .`, and
# that last leg installs no test plugins while still running the suite. So do
# hand-made venvs, `--target` layouts, sandboxes mutated after a bake, and any
# older image still on disk. The image fix removes the common case; this line
# is what makes the remaining cases say so out loud instead of inventing
# failures.
#
# `required_plugins` closes all of it the only way that is trustworthy — the
# run REFUSES to start. Missing plugin => exit 4 and one line naming it:
#
#     ERROR: Missing required plugins: pytest-asyncio
#
# instead of a red suite that looks like someone's bug. Measured: fires on a
# genuinely absent dist (rc=4) and does NOT false-positive on CI's
# `uv pip install --target` + PYTHONPATH layout (rc=0), which is how CI
# supplies these plugins today.
#
# Both entries are declared in the [dev] extra, which is the documented way to
# run this suite. pytest-asyncio is the one that fails SILENTLY (wrong answers,
# not an error); pytest-xdist is listed because CI's own command hard-depends
# on `-n`, and "Missing required plugins: pytest-xdist" beats pytest's own
# "unrecognized arguments: -n" for naming what to install.
required_plugins = ["pytest-asyncio", "pytest-xdist"]

testpaths = ["tests"]
python_files = ["test_*.py"]

# DUMP EVERY THREAD'S STACK WHEN A TEST STOPS MAKING PROGRESS.
#
# Purely diagnostic: pytest arms faulthandler and dumps tracebacks after this
# many seconds in ONE test. It does not fail, kill or skip anything — a slow
# test that finishes still passes, and the dump is the only side effect. That
# is why this is safe to set on a suite whose normal full run is ~6 minutes.
#
# WHY IT EXISTS. A matrix leg has now hung THREE times by this repo's own
# count (see the comments in pytest-matrix-on-ubuntu-py3-11-3-12-3-13.yml:
# PR #594's 1h39m, a duplicate py3.11 leg at 40+ min while its siblings
# finished in 11). MEASURED 2026-08-21 on run 32482771853: the py3.13 leg
# stalled at 67-68% and produced NO OUTPUT AT ALL for 36.5 minutes before the
# job's 45-minute timeout killed it — no test line, no traceback, nine orphan
# python processes reaped by the runner. Its py3.11 sibling passed in 6m12s on
# the same diff, concurrently, on a different host.
#
# Two agents then spent an evening refuting six hypotheses (the diff, an
# ambient Postgres error at the stall boundary, the host's store, within-run
# collision, a third repo's CI, and both runners on that box) and still could
# not say WHAT it blocked on — because the log cannot answer that question.
# This line makes the next occurrence answer it by itself.
#
# 300s is chosen against the observed suite: the whole run takes ~6 minutes, so
# no healthy single test comes near five minutes, and a real hang exceeds it
# long before the job's 45-minute wall.
faulthandler_timeout = 300
addopts = "-v --tb=short -p tests._store_isolation -m 'not integration and not docker_smoke'"
markers = [
    "integration: slow end-to-end tests that spawn a real Claude Code agent (require claude CLI + tmux + ANTHROPIC_API_KEY or SAC_ANTHROPIC_API_KEY). Opt in with '-m integration'.",
    "docker_smoke: real-Docker smoke tests for DockerRuntime (build image, start/stop newbie-docker agent, exec claude -p). Skipped unless docker daemon reachable. Opt in with '-m docker_smoke'.",
    "slow: slow tests opted-in with '-m slow'.",
    "e2e: end-to-end tests requiring real subsystems (set RUN_E2E=1 to enable)",
    "smoke: fast (<60s total) user-facing happy-path tests verifying the installed `sac` binary still works end-to-end. Run on every PR.",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# T201 (`print` found) allowlist — the raw-print gate's ONLY escape hatch.
#
# CI (.github/workflows/lint.yml, step "No raw print() in src/ (T201)") runs
# `ruff check --select T201,T203 src/`. sac's diagnostics belong to
# scitex-logging, which stamps the emitting module on every record and fans out
# to the rotating runtime log as well as stderr; a raw print carries no origin
# and dies with whatever stream was attached.
#
# Note T201 already ignores `print(..., file=<injected stream>)`, so a
# function whose caller supplies `stream=` / `err_stream=` / `log_stream=`
# needs NO entry here — that print is part of the function's reporting
# contract, not an unrouted diagnostic. Everything below therefore writes to a
# HARDCODED stdout/stderr on purpose.
#
# HOUSE RULE: one file per entry, each with its own written reason, added
# deliberately. Never a blanket ignore and never a widened glob — a gate that
# cannot fail is worse than no gate. If you are tempted to add an entry for a
# DIAGNOSTIC, you want the logger instead; these exemptions exist only where
# stdout/stderr IS the interface.
[tool.ruff.lint.per-file-ignores]
# The build hook runs under hatch during wheel/sdist construction, before the
# package (and therefore scitex_logging) is importable at all. Its prints are
# build-log progress; a logger here would be a circular dependency.
"src/hatch_build.py" = ["T201"]

# Claude Code WorktreeCreate hook, executed as a standalone script from the
# agent's own $HOME after being copied out of _baseline_assets. STDOUT IS THE
# PROTOCOL: the SDK reads the created worktree path from it (`print(policy_path)`),
# so a stray log line on stdout breaks worktree creation outright. Its stderr
# prints are the SDK's documented human-diagnostic channel. It also cannot rely
# on scitex_logging being importable in the environment it is copied into.
"src/scitex_agent_container/_baseline_assets/claude_worktree_hooks/worktree_create.py" = ["T201"]

# Same deal: a standalone Claude Code hook copied into the agent's $HOME,
# reporting through the SDK's stderr channel with no sac import available.
"src/scitex_agent_container/_baseline_assets/claude_worktree_hooks/worktree_remove.py" = ["T201"]

# Same deal: a standalone SessionStart hook copied into the agent's $HOME. Its
# one print is the reap summary the SDK surfaces to the operator.
"src/scitex_agent_container/_baseline_assets/claude_worktree_hooks/session_start_reap_stale.py" = ["T201"]

# `sac never-stop-when-task-remains` is a Claude Code Stop hook whose STDOUT IS
# A JSON DECISION FRAME (tests/.../test_never_stop_when_task_remains_cmds.py
# asserts `json.loads(stdout)` still parses). Routing its stderr diagnostics to
# a logger would risk a handler putting log text on stdout and corrupting that
# frame — the precise failure class this whole change is meant to avoid.
"src/scitex_agent_container/cli_pkg/never_stop_when_task_remains_cmds.py" = ["T201"]

# `sac-statusline` is invoked by Claude Code on every status-line update and its
# STDOUT IS THE RENDERED STATUS LINE consumed by the client. Nothing else may
# appear there.
"src/scitex_agent_container/statusline.py" = ["T201"]

# A standalone probe baked into the SIF and run by the image build to verify
# the artifact's symbols. It deliberately imports nothing from sac (that is the
# point of the probe) and its stdout OK/FATAL lines are the build's verdict.
"src/scitex_agent_container/containers/sif_symbol_probe.py" = ["T201"]

# A worked example shipped inside a skill for operators to copy and run; its
# print is the example's output. Not a sac code path.
"src/scitex_agent_container/_skills/scitex-agent-container/scitex_smoke_test.py" = ["T201"]

[tool.coverage.run]
# Subprocess + multi-process coverage: child Python interpreters
# (subprocess.run, jupyter nbconvert --execute, etc.) are wired in via
# tests/conftest.py force-set of COVERAGE_PROCESS_START + a .pth shim.
# See ~/proj/scitex-dev/src/scitex_dev/_skills/general/05_development_06_subprocess-coverage.md.
parallel = true
branch = true
source = ["scitex_agent_container"]
concurrency = ["multiprocessing", "thread"]
