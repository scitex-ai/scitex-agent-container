[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-agent-container"
version = "0.8.1"
description = "Declarative YAML-based framework for defining, managing, and orchestrating AI coding agent instances"
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "scitex",
    "agent",
    "container",
    "claude-code",
    "orchestration",
    "yaml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scitex-container>=0.1.0",
]

[project.optional-dependencies]
telegram = [
    "claude-code-telegrammer>=0.1.0",
]
dev = [
    "scitex-dev",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pre-commit>=3.5.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]

[project.scripts]
scitex-agent-container = "scitex_agent_container.cli:main"
sac = "scitex_agent_container.cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-agent-container = "scitex_agent_container"

[project.entry-points."scitex_dev.skills"]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-agent-container"
Repository = "https://github.com/ywatanabe1989/scitex-agent-container.git"
Issues = "https://github.com/ywatanabe1989/scitex-agent-container/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_agent_container"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: slow end-to-end tests that spawn a real Claude Code agent (require claude CLI + tmux + ANTHROPIC_API_KEY or SCITEX_AGENT_CONTAINER_CI_ANTHROPIC_API_KEY). Opt in with '-m integration'.",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
