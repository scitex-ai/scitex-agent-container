# researcher-opus — opus-powered researcher role
#
# Migrated to v3 on 2026-04-23:
#   * apiVersion v1 -> scitex-agent-container/v3
#   * removed metadata.name (dir-as-SSoT; filename is the agent name)
#   * health.method: screen-alive -> sdk-alive (already set)
#   * screen.name dropped (auto-derived from agent name in v3 loader)
#
# TEMPLATE NOTE — dir-as-SSoT:
# The v3 loader derives the agent name from the parent directory
# (``<name>/<name>.yaml``). This file ships flat; to instantiate, copy
# to ``<somewhere>/researcher-opus/researcher-opus.yaml``.

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    role: researcher
    team: research

spec:
  runtime: docker
  image: scitex-agent-container:scitex
  dockerfile: ./containers/Dockerfile
  model: opus
  workdir: ~/proj

  claude:
    flags:
      - --dangerously-skip-permissions
    session: new

  env:
    SCITEX_AGENT_CONTAINER_ROLE: researcher
    SCITEX_AGENT_CONTAINER_ID: researcher-opus

  health:
    enabled: true
    interval: 45
    timeout: 5
    method: sdk-alive

  restart:
    policy: on-failure
    max_retries: 5
    backoff:
      initial: 15
      max: 120
      multiplier: 2

  hooks:
    pre_start: []
    post_start: []
    pre_stop: []
    post_stop: []

# EOF
