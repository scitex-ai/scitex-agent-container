apiVersion: cld-agent/v1
kind: Agent
metadata:
  name: telegram-master
  labels:
    role: telegram
    team: core
spec:
  runtime: claude-code
  model: opus[1m]
  workdir: ~/proj

  # container:                    # Uncomment to run in a container
  #   runtime: docker              # docker | apptainer | none
  #   image: scitex-agent-container:latest
  #   volumes:
  #     - ~/proj:/workspace
  #   network: host

  skills:
    required:
      - quality-guards
      - autonomous
      - speech
    available:
      - scitex
      - code-review
      - orchestrator

  claude:
    channels:
      - plugin:telegram@claude-plugins-official
    flags:
      - --dangerously-skip-permissions
    session: continue

  env:
    CLAUDE_AGENT_ROLE: telegram
    CLAUDE_AGENT_ID: telegram-master

  screen:
    name: cld-telegram

  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    allowed_users:
      - "8379369979"
    auto_connect: true
    greeting: "Telegram agent connected. Ready for instructions."

  startup_commands:
    - delay: 5
      command: "/speak-and-call"

  watchdog:
    enabled: true
    interval: 1.5
    responses:
      y_n: "1"
      y_y_n: "2"
      waiting: "/speak-and-call"

  health:
    enabled: true
    interval: 30
    timeout: 5
    method: screen-alive

  restart:
    policy: on-failure
    max_retries: 3
    backoff:
      initial: 30
      max: 300
      multiplier: 2

  hooks:
    post_start:
      - "telegrammer-hook post-start"
    pre_stop:
      - "telegrammer-hook pre-stop"
