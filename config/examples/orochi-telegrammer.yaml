apiVersion: cld-agent/v1
kind: Agent
metadata:
  name: orochi-telegrammer
  labels:
    role: telegram
    team: orochi
spec:
  runtime: claude-code
  model: opus[1m]
  workdir: ~/proj

  skills:
    required:
      - quality-guards
      - autonomous
      - speech
      - scitex
    available:
      - code-review
      - orchestrator

  claude:
    channels: []
    flags:
      - --dangerously-skip-permissions
      - "--mcp-config /tmp/scitex-agent-container/mcp-orochi-telegrammer.json"
      - "--dangerously-load-development-channels server:telegram"
    session: new

  env:
    CLAUDE_AGENT_ROLE: telegram
    CLAUDE_AGENT_ID: orochi-telegrammer
    SCITEX_OROCHI_DISABLE: "true"
    TELEGRAM_STATE_DIR: ~/.scitex/agent-container/telegram/8146978246
    TELEGRAM_BOT_TOKEN: "${SCITEX_OROCHI_TELEGRAM_BOT_TOKEN}"

  screen:
    name: cld-orochi-tg

  telegram:
    bot_token_env: SCITEX_OROCHI_TELEGRAM_BOT_TOKEN
    allowed_users:
      - "8379369979"
    auto_connect: true
    greeting: "SciTeX Orochi Telegrammer connected."

  orochi:
    hosts:
      - 192.168.11.22
      - scitex-orochi.com
    port: 8559
    token_env: SCITEX_OROCHI_TOKEN
    channels:
      - server:scitex-orochi

  startup_commands: []

  watchdog:
    enabled: false

  health:
    enabled: true
    interval: 30
    timeout: 5
    method: screen-alive

  restart:
    policy: on-failure
    max_retries: 3
    backoff:
      initial: 30
      max: 300
      multiplier: 2

  hooks:
    pre_start:
      - "telegrammer-hook pre-start"
    post_start:
      - "telegrammer-hook post-start"
    pre_stop:
      - "telegrammer-hook pre-stop"
