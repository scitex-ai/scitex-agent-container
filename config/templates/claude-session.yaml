# claude-session — programmatic agent backed by claude-agent-sdk.
#
# This is the SDK-native counterpart to local.yaml. Instead of running
# the `claude` CLI inside tmux, sac spawns a Python runner that drives
# ClaudeSDKClient directly. No TUI prompts, no auto-accept, no
# pane-state classifier — Pro/Max OAuth is read straight from
# ~/.claude/.credentials.json (flat-rate, no env-var bridge needed on
# workstations).
#
# Daemon mode (default):
#   sac start /path/to/<name>.yaml
#   sac show-status <name>           # heartbeat + pid
#   sac show-logs <name>             # rendered transcript from session.jsonl
#   sac stop <name>
#
# Foreground mode (visibility — runs in your current terminal,
# streams assistant output to stdout, exits when the turn completes):
#   sac start /path/to/<name>.yaml --foreground
#
# Auto-resume: state_dir/session_id is persisted after each turn.
# Subsequent `sac start` calls forward it to ClaudeAgentOptions(resume=…)
# so a watchdog respawn picks up where the previous run left off.

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: claude-session

spec:
  runtime: claude-session
  model: claude-haiku-4-5
  workdir: ~/.scitex/agent-container/workspaces/claude-session-demo

  startup_commands:
    # The first non-empty entry's `command` becomes the SDK mission
    # (the initial user prompt).
    - command: "Reply with exactly the string 'sdk-runtime-ok' and nothing else."

  health:
    enabled: true
    interval: 30
    method: multiplexer-alive   # claude-session uses heartbeat.json

  restart:
    policy: never

# EOF
