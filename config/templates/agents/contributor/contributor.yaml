# Contributor template — cloned by proj-* agents when spawning a per-PR contributor.
#
# Substitution variables (proj-* agent must replace before copy):
#   ${PROJECT}      — project name, e.g. "hello-world"
#   ${BRANCH_KIND}  — feat | fix | refactor | docs | test
#   ${BRANCH_SHORT} — short branch slug, e.g. "123-add-greeting"
#   ${HOST}         — host where the contributor should run (mgr-todo decides)
#
# Final agent name: contributor-${PROJECT}-${BRANCH_KIND}-${BRANCH_SHORT}
#
# Sac built-in interpolation (left intact, resolved at agent start):
#   ${metadata.name}, ${HOSTNAME}, ${SCITEX_OROCHI_TOKEN}, etc.

apiVersion: scitex-agent-container/v3

kind: Agent

metadata:
  labels:
    role: contributor-${PROJECT}
    team: orochi
    trigger: pr-driven
    project: ${PROJECT}
    branch_kind: ${BRANCH_KIND}
    branch_short: ${BRANCH_SHORT}
    capabilities: fork,clone,branch,commit,push,open-pr

spec:
  # Sac is SDK-only; one container backend wraps the long-running runner.
  runtime: docker
  image: scitex-agent-container:scitex
  dockerfile: ./containers/Dockerfile
  model: "sonnet"

  # Singleton — one contributor per branch.
  host:
    - ${HOST}

  # A2A protocol sidecar (auto-launched by sac when spec.a2a is set).
  # Lets peer agents reach this one via JSON-RPC.
  #
  # port:    TCP port the sidecar binds (no default; required to enable A2A)
  # handler: which responder runs each request — one of:
  #   echo       — canned reply with the user text (default; smoke test, zero deps)
  #   claude_cli — runs `claude --print` and forwards stdout (real LLM; needs claude on PATH)
  #   exec       — runs $SAC_A2A_EXEC_COMMAND with user text on stdin (custom)
  # host:    bind address — 127.0.0.1 (default; loopback only) or 0.0.0.0 (LAN)
  # a2a:
  #   port: 19100
  #   handler: echo
  #   host: 127.0.0.1

  orochi:
    enabled: true
    hosts:
      - scitex-orochi.com

  claude:
    flags:
      - --dangerously-skip-permissions
      - "--dangerously-load-development-channels server:scitex-orochi"
      - --add-dir ~/proj/scitex-agent-container/src/scitex_agent_container/_skills/
      - --add-dir ~/proj/scitex-orochi/src/scitex_orochi/_skills/
      - --add-dir ~/.scitex/orochi/shared/skills/
    session: continue-or-new

  skills:
    # injection_mode: how sac materializes skills into CLAUDE.md
    #   at-import  — emit @<path> lines for eager inline (default; Anthropic @-import)
    #   block      — emit ```skills <name>``` block (legacy lazy form)
    # injection_mode: at-import   # default

    # match_by: strategies used to resolve a name → file paths
    #           (at-import only; runs independently, unions + dedups)
    #   skill-id  — <dir>/SKILL.md, identity = frontmatter.name or dir.name (Anthropic)
    #   tag       — frontmatter `tags:` scan
    #   filename  — basename match (broader; opt-in)
    # match_by: [skill-id, tag]   # default

    # match_style: how the value is compared to the candidate
    #   exact   — value == candidate
    #   partial — value substring of candidate (case-sensitive)
    # match_style: exact   # default

    required:
      - scitex
      - scitex-agent-container
      - scitex-orochi

  python-venv:
    - ~/.venv
    - ~/.venv-3.11

  health:
    enabled: true
    interval: 60
    timeout: 5
    method: sdk-alive

  restart:
    policy: on-failure
    max_retries: 3
    backoff:
      initial: 30
      max: 300
      multiplier: 2

  context_management:
    strategy: compact
    trigger_at_percent: 70.0
    check_interval_seconds: 300
    warn_before_n_checks: 1

  # FR#3: ZOO#12 keys (cardinality_enforced_at_hub, priority_list) live
  # under `extensions:` rather than at the top of `spec:`. Opt in by
  # uncommenting; _lifecycle/handover.py currently reads from `spec`
  # directly, so until that reader is migrated this stays inert.
  # extensions:
  #   cardinality_enforced_at_hub: true

  startup_commands:
    - delay: 5
      command: "Run boot sequence per src_CLAUDE.md (backfill, identity verify, DM proj-scitex-maintenance, fork upstream, clone, branch, root-cause fix, push, open Gitea PR)."
