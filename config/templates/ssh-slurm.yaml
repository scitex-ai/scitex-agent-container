# ssh-slurm — agent submitted as a SLURM job on an HPC cluster.
#
# Pattern: long-running compute on a shared cluster. The slurm runtime
# wraps the agent in an ``sbatch`` allocation, runs it in tmux on the
# allocated compute node, holds the allocation with ``tail -f /dev/null``,
# and auto-resubmits ~1h before walltime via a ``SIGUSR1`` trap
# (llama-on-slurm pattern).
#
# Where sac runs:
# The slurm runtime shells out to ``sbatch``/``squeue``/``scancel``
# locally — i.e. wherever sac is invoked. To drive a remote cluster
# from your laptop, SSH to the login node first and run sac there, OR
# wrap with the ``ssh`` pattern + ``no_preflight: true`` (so sac itself
# is dispatched via SSH and submits the job from the login node).
#
# Lmod / ``module load`` clusters: declare a ``pre_agent`` hook that
# runs ``module load Python/<ver>`` etc. Hooks are *sourced* (not
# exec'd) so env mutations persist into the agent process.
#
# Hook env vars (set before each hook is sourced):
#   SAC_AGENT_ID, SAC_JOB_ID, SAC_WORKDIR, SAC_LOG_FILE, SAC_PHASE
# Phases: pre_submit | pre_agent | walltime_signal | post_agent | attach

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: ssh-slurm

spec:
  runtime: slurm
  model: sonnet
  workdir: ~/.scitex/agent-container/workspaces/ssh-slurm
  multiplexer: tmux                # SLURM runtime always uses tmux on compute node

  claude:
    flags:
      - --dangerously-skip-permissions
    session: continue-or-new

  slurm:
    partition: ""                  # cluster default; e.g. "sapphire" on Spartan
    time_limit: "1-00:00:00"       # D-HH:MM:SS; auto-resubmit fires 1h before
    cpus_per_task: 1
    mem: "4G"
    nodes: 1
    ntasks: 1
    gres: ""                       # e.g. "gpu:1"
    signal: "B:USR1@3600"
    auto_resubmit: true
    logs_dir: ~/slurm_logs
    extra_directives: []           # e.g. ["#SBATCH --qos=high"]
    hooks:
      pre_submit: ""               # sourced on submission host before sbatch
      pre_agent: ""                # sourced inside sbatch before agent starts (module load here)
      walltime_signal: ""          # sourced from USR1 handler before resubmit
      post_agent: ""               # sourced after agent exits
      attach: ""                   # sourced before srun --pty tmux attach

  health:
    enabled: true
    interval: 60
    method: multiplexer-alive

  restart:
    policy: never                  # SLURM auto-resubmit handles walltime

# EOF
