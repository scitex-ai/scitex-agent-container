# docker — minimal claude-code agent inside a Docker container.
#
# Pattern: containerized local execution. Container is the isolation
# boundary; ``mount_host_claude`` is opt-in so host identity does NOT
# leak in by default.

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: docker

spec:
  runtime: claude-code
  model: sonnet
  workdir: ~/.scitex/agent-container/workspaces/docker
  multiplexer: tmux                # tmux inside container -> capture-pane works

  container:
    runtime: docker
    image: scitex-agent-container:latest
    network: host                  # host | bridge | none
    volumes:
      - ~/proj:/workspace
    mount_host_claude: false       # opt-in: set true to share host skills/MCP/memory

  claude:
    flags:
      - --dangerously-skip-permissions
    session: continue-or-new

  health:
    enabled: true
    interval: 60
    method: multiplexer-alive

  restart:
    policy: never

# EOF
