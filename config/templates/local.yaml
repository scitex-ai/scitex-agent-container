# local — minimal claude-code agent on the local host (no container, no SSH).
#
# Pattern: bare-metal local execution. Use as the starting point for
# agents that share the operator's environment (skills, MCP, venv).
#
# Instantiate (dir-as-SSoT):
#   cp local.yaml ~/.scitex/orochi/agents/<name>/<name>.yaml

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: local

spec:
  runtime: claude-code
  model: sonnet
  workdir: ~/.scitex/agent-container/workspaces/local
  multiplexer: tmux

  claude:
    flags:
      - --dangerously-skip-permissions
    session: continue-or-new

  health:
    enabled: true
    interval: 60
    method: multiplexer-alive

  restart:
    policy: never

# EOF
