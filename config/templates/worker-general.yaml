# worker-general — generic fallback worker role (no container)
#
# Migrated to v3 on 2026-04-23:
#   * apiVersion v1 -> scitex-agent-container/v3
#   * removed metadata.name (dir-as-SSoT; filename is the agent name)
#   * health.method already multiplexer-alive
#   * screen.name dropped (auto-derived from agent name in v3 loader)

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    role: worker
    team: dev

spec:
  runtime: claude-code
  model: sonnet
  workdir: ~/proj

  claude:
    flags:
      - --dangerously-skip-permissions
    session: new

  env:
    SCITEX_AGENT_CONTAINER_ROLE: worker
    SCITEX_AGENT_CONTAINER_ID: worker-general

  health:
    enabled: true
    interval: 60
    timeout: 5
    method: multiplexer-alive

  restart:
    policy: never
    max_retries: 0

  hooks:
    pre_start: []
    post_start: []
    pre_stop: []
    post_stop: []

# EOF
