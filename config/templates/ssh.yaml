# ssh — agent that runs in a docker container on a remote host.
#
# Pattern: cross-machine fleet member. F-CS12 introduced
# ``sac --on <peer> agent start <name>`` which ssh's into <peer>
# and runs sac there. The remote sac sees this yaml as a normal
# local invocation and does ``docker run`` on its own filesystem.
# No sac-side ssh dispatch — that lives entirely in F-CS12's host
# group.
#
# Requirements on the remote host:
#   * docker (or podman) installed
#   * sac itself installed (so ``sac --on host`` actually finds a
#     remote sac to dispatch to)
#   * an entry under ``peers:`` in ~/.scitex/agent-container/sac.yaml
#     on the laptop pointing at this host

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: ssh

spec:
  runtime: docker
  image: scitex-agent-container:scitex
  dockerfile: scitex_agent_container/containers/Dockerfile.scitex
  model: sonnet
  workdir: ~/proj/example

  claude:
    flags:
      - --dangerously-skip-permissions
    session: continue-or-new

  health:
    enabled: true
    interval: 60
    method: sdk-alive

  restart:
    policy: on-failure
    max_retries: 3

# EOF
