# worker-v2 — worker with scitex-orochi MCP wiring.
#
# Previously v2, migrated to v3 on 2026-04-23:
#   * apiVersion scitex-agent-container/v2 -> .../v3
#   * removed metadata.name (dir-as-SSoT; filename is the agent name).
#     ``${metadata.name}`` in mcp_servers still resolves — the v3 loader
#     injects the dir-derived name into the interpolation metadata.
#   * health.method already multiplexer-alive (kept)
#
# Filename intentionally kept as ``worker-v2`` to preserve the name other
# tooling references; the schema underneath is now v3.

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    role: worker
    team: dev

spec:
  runtime: claude-code
  model: sonnet

  claude:
    flags:
      - --dangerously-skip-permissions
    session: new

  mcp_servers:
    scitex-orochi:
      type: stdio
      command: bun
      args:
        - run
        - "~/proj/scitex-orochi/ts/mcp_channel.ts"
      env:
        SCITEX_OROCHI_URL: "wss://scitex-orochi.com"
        SCITEX_OROCHI_AGENT: "${metadata.name}"
        SCITEX_OROCHI_TOKEN: "${SCITEX_OROCHI_TOKEN}"
        # Channel subscriptions are hub-DB authoritative — manage via
        # the web UI or MCP `subscribe` tool, not via env vars.

  health:
    enabled: true
    interval: 60
    timeout: 5
    method: multiplexer-alive

  restart:
    policy: never
    max_retries: 0

# EOF
