# apptainer — claude-agent-sdk runner inside an Apptainer (Singularity) container.
#
# Pattern: containerized execution on hosts where Docker is unavailable
# (HPC compute nodes, locked-down workstations). Submit your sbatch
# script yourself and run ``sac agent start <name>`` inside the
# allocation — sac is a container wrapper, not a scheduler (F-CS16
# design call: SLURM is the operator's concern).

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: apptainer

spec:
  runtime: apptainer
  image: ~/.scitex/agent-container/containers/scitex-agent-container-scitex.sif
  model: sonnet
  workdir: ~/proj/example

  claude:
    flags:
      - --dangerously-skip-permissions
    session: continue-or-new

  health:
    enabled: true
    interval: 60
    method: sdk-alive

  restart:
    policy: never

# EOF
