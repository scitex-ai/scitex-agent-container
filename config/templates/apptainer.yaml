# apptainer — minimal claude-code agent inside an Apptainer (Singularity) container.
#
# Pattern: containerized execution on hosts where Docker is unavailable
# (HPC compute nodes, locked-down workstations). Pair with ``ssh-slurm``
# when the SIF lives on a shared filesystem and the agent runs on a
# compute node.

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: apptainer

spec:
  runtime: claude-code
  model: sonnet
  workdir: ~/.scitex/agent-container/workspaces/apptainer
  multiplexer: tmux

  container:
    runtime: apptainer
    image: ~/containers/claude-code-container.sif   # absolute or ~-prefixed SIF path
    mount_host_claude: false                        # opt-in

  claude:
    flags:
      - --dangerously-skip-permissions
    session: continue-or-new

  health:
    enabled: true
    interval: 60
    method: multiplexer-alive

  restart:
    policy: never

# EOF
