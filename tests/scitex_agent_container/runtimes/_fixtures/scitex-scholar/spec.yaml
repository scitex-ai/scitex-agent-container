apiVersion: scitex-agent-container/v3
kind: Agent
metadata:
  labels:
    project: scitex-scholar
    purpose: scitex-scholar-repo-manager
    role: repo-manager
    groups:
    - developer
    - active
    - app
    cardinality: singleton
spec:
  runtime: tui
  harness: codex
  engine: codex-gpt-6.1-sol-ultra-fast
  available_harnesses:
    hermes:
      session:
        mode: continue
        max_age_minutes: null
    codex:
      session:
        mode: continue
        max_age_minutes: null
      approval_policy: never
      sandbox_mode: danger-full-access
    claude-code:
      session:
        mode: continue
        max_age_minutes: null
      approval_policy: never
      watchdog:
        enabled: false
        interval: 1.5
        responses:
          y_n: '1'
          y_y_n: '2'
          waiting: /speak-and-call
  available_engines:
    codex-gpt-6.1-sol-ultra-fast:
      model: gpt-6.1-sol
      subscription:
        provider: openai
        account: openai:fleet-lead-native
      reasoning_effort: ultra
      service_tier: fast
    scitex-free:
      # Paid Muse Spark 1.3 contributor via Hermes NATIVE provider
      # opencode-go (owns endpoint/protocol/x-opencode-session).
      model: muse-spark-1.3-contributor
      provider:
        hermes_provider: opencode-go
        auth_token_env: OPENCODE_GO_API_KEY
      max_context_tokens: 1048576
    opencode-go-deepseek-v4.1-flash:
      model: deepseek-v4.1-flash
      provider:
        base_url: https://opencode.ai/zen/go/v1
        auth_token_env: OPENCODE_GO_API_KEY
        extra_headers:
          User-Agent: scitex-agent-container/hermes
          x-opencode-session: ${sac:session_id}
    qwen38-27b:
      model: qwen38-27b
      provider:
        base_url: http://100.64.0.1:18772
        auth_token_env: SCITEX_GENAI_GATEWAY_API_KEY
      max_context_tokens: 1000000
      reasoning_effort: low
      timeouts:
        upstream_deadline_seconds: 1800
        client_abandonment_seconds: 1860
    claude-opus:
      model: opus[1m]
      provider: anthropic
      max_context_tokens: 1000000
      reasoning_effort: high
  host: scitex-compute-03
  workdir: /home/ywatanabe/proj/scitex-scholar/.worktrees/sac-scitex-scholar-7345f075
  extensions: {}
  apptainer:
    image: sac-base
    relaxed: true
    binds:
    - /scratch:/scratch:rw
    - /home/ywatanabe:/home/ywatanabe:rw
    - /home/ywatanabe/.ssh:/home/agent/.ssh:ro
    - /home/ywatanabe/.config/gh:/home/agent/.config/gh:ro
    raw_args:
    - --userns
    - --containall
    - --home
    - /home/agent
    env:
      SCITEX_CARDS_AGENT_ID: scitex-scholar
      SCITEX_CARDS_DB: postgresql://scitex-primary:55432/scitex
      SCITEX_CARDS_NOTIFY_DSN: postgresql://scitex-primary:55433/scitex
      PGPASSFILE: /home/ywatanabe/.pgpass
      GIT_AUTHOR_NAME: scitex-scholar
      GIT_AUTHOR_EMAIL: agent@scitex.ai
      GIT_COMMITTER_NAME: scitex-scholar
      GIT_COMMITTER_EMAIL: agent@scitex.ai
      GIT_SSH_COMMAND: ssh -o ControlMaster=no -o ControlPath=none
      TMPDIR: /uvwork/tmp
      UV_CACHE_DIR: /uvwork/uvcache
      UV_PROJECT_ENVIRONMENT: /uvwork/venv-agent
    post: ''
    environment: {}
    def_file: ''
    nv: false
    rocm: false
    overlay: /home/ywatanabe/.scitex/agent-container/containers/overlays/scitex-scholar/
    overlay_size: ''
    overlay_create_if_missing: true
    tmpfs_size: 2G
    fakeroot: false
    jail: false
    nested_build: false
  a2a:
    port: auto
    host: 127.0.0.1
  startup_commands:
  - command: '[ -L "$HOME/proj" ] && rm -f "$HOME/proj"; ln -sfn /home/ywatanabe/proj "$HOME/proj"'
  - command: mkdir -p /uvwork/tmp /uvwork/bin && export TMPDIR=/uvwork/tmp UV_INSTALL_DIR=/uvwork/bin UV_CACHE_DIR=/uvwork/uvcache PATH=/uvwork/bin:$PATH && { [ -x /uvwork/bin/uv ] || curl -LsSf https://astral.sh/uv/install.sh | env TMPDIR=/uvwork/tmp UV_INSTALL_DIR=/uvwork/bin sh; }
  - command: '[ -x /uvwork/venv-agent/bin/python ] || { export TMPDIR=/uvwork/tmp UV_CACHE_DIR=/uvwork/uvcache PATH=/uvwork/bin:$PATH && cd /home/ywatanabe/proj/scitex-scholar/.worktrees/sac-scitex-scholar-7345f075 && /uvwork/bin/uv venv /uvwork/venv-agent --python python3 && /uvwork/bin/uv pip install --python /uvwork/venv-agent/bin/python -e .; }'
  startup_prompts:
  - "Native Codex migration continuity for scitex-scholar: retain this same agent identity, declared host, owned source workdir and branch, bot namespace, Comms and Cards assignments. At the first native turn, recover your own retained Hermes checkpoint and latest authoritative session through the official Hermes/SAC history tools, read the source AGENTS.md, and verify your existing SAC worktree ownership before editing. Preserve retained histories and unfinished work. If earlier context cannot be recovered, say exactly what is missing; do not invent a replacement session or task. Check current operator messages and Card notifications, then resume the assigned work from that continuity evidence."
  - 'Environment contract on SciTeX compute nodes: SAC binds /uvwork to this agent''s private directory under the host scratch volume. Reuse /uvwork/venv-agent and /uvwork/uvcache. Run /uvwork/bin/uv for dependency operations and /uvwork/venv-agent/bin/python for Python/tests. Do not create a repository-local or throwaway venv and do not use raw pip unless uv is genuinely unavailable; report that condition instead of silently rebuilding.'
  - Start or continue. Scan your scitex-cards slices, resume any in-flight or assigned work (hold idle if none), then report readiness. Follow AGENTS.md and your skills; don't restate, don't invent scope.
  health:
    enabled: true
    interval: 60
    timeout: 5
    method: sdk-alive
  restart:
    policy: on-failure
    max_retries: 3
    backoff:
      initial: 30
      max: 300
      multiplier: 2
    prune_on_stop: false
  python-venv: ''
  listen: []
  mcp_servers:
    scitex-cards:
      type: stdio
      command: /opt/venv-sac/bin/scitex-cards
      args:
      - mcp
      - start
  user: ''
  to_home: ./to_home
  to_home_layers:
  - user-shared
  - per-agent
  autonomous:
    enabled: true
    drive_until: DONE
    max_turns: 50
    idle_kick_after_s: 600
    kick_text: Continue. Print DONE when finished.
  hooks:
    pre_start: []
    post_start: []
    pre_stop: []
    post_stop: []
    on_compact: []
    on_restart: []
    on_diff: []
  comms:
    channels:
    - server:sac
    - server:scitex-cards
    outbound:
      siblings: allow
      parent: allow
    inbound:
      siblings: allow
      parent: allow
    a2a:
      listen: true
  lineage:
    group: ''
    may_spawn: true
