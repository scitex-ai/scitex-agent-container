# Minimal `runtime: tui` smoke fixture (TUI step-2 AC, lead a2a
# d383f5389dc548a49a293bffe390d619). NOT a production spec —
# tests/scitex_agent_container/runtimes/test_tui_session_real_smoke.py
# loads it to drive a real tmux + real claude TUI inside the container.
#
# The shape is the bare minimum that exercises the runtime: a tui
# runtime, a claude block (so the materialiser writes CLAUDE.md), a
# trivial mission, and a `to_home/` next to this file that the
# overlay step copies into <state>/home/.
#
# Operator can later promote this shape to a canonical
# `examples/agents/tui-agent/` once steps 3-4 land.

apiVersion: scitex-agent-container/v3
kind: Agent

# NOTE: `metadata.name` intentionally omitted — sac v3 derives the agent
# name from the parent directory (dir-as-SSoT). The test copies this
# tree into ``<tmp>/<agent-name>/<agent-name>.yaml`` per run, so the
# name varies but the spec body stays constant.

metadata:
  labels:
    pattern: tui-runtime-real-smoke
    in-repo: "true"

spec:
  runtime: tui

  claude:
    model: haiku
    flags:
    - --dangerously-skip-permissions

    channels: []
    raw_options: {}
    session:
    continue_max_age_minutes:
    resume_id: ''
    auto_accept: true
    account: ''
    credentials_file: ''
    credentials_files: []
    provider:
  startup_prompts:
  - "Reply with the string 'tui-runtime-ok' and nothing else."

  restart:
    policy: never

# EOF
    max_retries: 3
    backoff:
      initial: 30
      max: 300
      multiplier: 2
    prune_on_stop: false
  # DELIBERATELY the deprecated `provider:` spelling of `harness:`. The
  # fleet's existing specs are written this way, so one checked-in fixture
  # keeps loading through the alias — if the back-compat path ever breaks,
  # a real smoke fixture goes red rather than only a unit test.
  provider: anthropic
  workdir:
  python-venv: ''
  startup_commands: []
  listen: []
  extensions: {}
  mcp_servers: {}
  user: ''
  to_home: ./to_home
  container:
    image: scitex-agent-container:latest
    volumes: []
    network: host
    mount_host_claude: false
  health:
    enabled: false
    interval: 30
    timeout: 5
    method: sdk-alive
  watchdog:
    enabled: false
    interval: 1.5
    responses:
      y_n: '1'
      y_y_n: '2'
      waiting: /speak-and-call
  autonomous:
    enabled: false
    drive_until: DONE
    max_turns: 50
    idle_kick_after_s: 120
    kick_text: Continue. Print DONE when finished.
  apptainer:
    image: ''
    binds: []
    env: {}
    raw_args: []
    post: ''
    environment: {}
    def_file: ''
    nv: false
    rocm: false
    overlay: ''
    overlay_size: ''
    overlay_create_if_missing: true
    tmpfs_size: 2G
    relaxed: false
    fakeroot: false
    jail: false
    nested_build: false
  hooks:
    pre_start: []
    post_start: []
    pre_stop: []
    post_stop: []
    on_compact: []
    on_restart: []
    on_diff: []
  a2a:
    host: 127.0.0.1
    port: auto
  comms:
    outbound:
      siblings: allow
      parent: allow
    inbound:
      siblings: allow
      parent: allow
    a2a:
      listen: true
  lineage:
    group: ''
    may_spawn: true
  host: ${HOSTNAME}
