# scitex-dev project-type config
# Drives which rule families the auditor applies.
# See: scitex-dev ecosystem audit-project --help

project-type:
  - pip

audit:
  exemptions:
    # PS-224 (runner-destination-unregistered). `ubuntu-latest` is unserved BY
    # DESIGN — we do not pay for hosted runners — so this red is real content,
    # not a registry artefact. It is exempted rather than fixed because the
    # blocker is SECURITY, not capability, and moving the job to Spartan would
    # be a regression. The full argument lives in the block comment at the top
    # of .github/workflows/cla.yml; the short version is four facts that only
    # bite when combined:
    #   1. `issue_comment` / `pull_request_target` are UNAUTHENTICATED triggers
    #      on a public repo — a GitHub account is the entire barrier to entry.
    #   2. The fork-PR approval gate covers `pull_request`, NOT these two.
    #   3. The job body is third-party code (SHA-pinned here, not tag-pinned).
    #   4. Spartan runners are PERSISTENT and $HOME is the operator's real home,
    #      holding ~/.claude/.credentials.json — the live fleet credential.
    # Composed: repointing would let any stranger run third-party code on the
    # machine holding the fleet's credentials by leaving a comment. Revisit
    # when an ephemeral/isolated runner exists for untrusted-trigger workflows
    # (option (a) in the cla.yml comment); that closes this exemption properly.
    PS-224:
      - path: .github/workflows/cla.yml::CLAssistant
        line: 0
        reason: >-
          Deliberately GitHub-hosted, escalated to the operator as a named
          exception. This workflow runs a third-party action under the
          UNAUTHENTICATED `issue_comment` and `pull_request_target` triggers,
          which the fork-PR approval gate does not cover. Spartan runners are
          persistent and their $HOME is the operator's real home holding the
          live fleet credential, so repointing would let any stranger execute
          third-party code next to that credential by commenting on an issue —
          a security regression, not a compliance win. Kept hosted until an
          ephemeral/isolated runner exists for untrusted-trigger workflows.

  # PS-226 (job-name-not-hyphenated), introduced by scitex-dev 0.48.0.
  #
  # THIS IS A DEFERRAL, NOT A WAIVER, AND THE FINDING IS CORRECT.
  # `JobSpec(name="sac.accounts-refresh")` is genuinely not hyphen-
  # separated, and the rule exists for a real reason:
  # `jobs/_systemd.py::systemd_unit_name` derives the unit FILENAME from
  # the job name verbatim, with no sanitisation.
  #
  # What is deferred is the REMEDY, because the obvious one is more
  # dangerous than the defect. Renaming does not re-label the running
  # unit; it makes sac install a SECOND unit beside the live hand-written
  # one. That unit is the fleet's SOLE OAuth refresher, and it refreshes a
  # SINGLE-USE token — two refreshers racing revoke each other, taking
  # every agent's authentication down with them. So the rename is a
  # supervised systemd unit migration (stop-old -> remove-old ->
  # install-new -> verify-exactly-one), never a drive-by edit, and
  # never at an hour when nobody is watching.
  #
  # The supervised path already exists: `_jobs/_migrate/_renames.py`.
  # This entry comes off in the same change that runs the migration.
  skip-rules:
    - rule: PS-226
      reason: >-
        Correct finding, deferred to the supervised job-name migration —
        not waived. `systemd_unit_name` uses `JobSpec.name` verbatim, so
        renaming `sac.accounts-refresh` installs a SECOND unit beside the
        live one instead of adopting it. That job is the fleet's sole
        OAuth refresher against a SINGLE-USE refresh token, where two
        racing refreshers revoke each other and take fleet-wide
        authentication down. The migration must be ordered stop-old ->
        remove-old -> install-new -> verify-exactly-one and run
        supervised; the path exists in `_jobs/_migrate/_renames.py`.
        Tracked in card `sac-accounts-refresh-unit-migration`; this entry
        is removed by the change that performs the migration.

  # PS-103: legitimate top-level dirs that are not part of the wheel
  # but are operator-facing artefacts:
  #   - config/      declarative YAML schema + templates the CLI
  #                  reads at runtime (mounted from the host, not
  #                  vendored into the package).
  #   - containers/  apptainer/Dockerfile build sources used by
  #                  `sac image build` and the SDK runtime smoke
  #                  workflow. Not Python.
  root-whitelist:
    files:
      # PS-103: codecov.yml is the canonical Codecov location. There's no
      # baseline allowlist for it because Codecov also reads from .github/
      # — but every other SciTeX package keeps it at the root, so we do
      # too. See 02_package_11_ci-and-codecov.md.
      - codecov.yml
    dirs:
      - config
      - containers

