# In-repo smoke-test agent for the claude-session runtime.
#
# This file lives at <repo>/.scitex/agent-container/agents/sdk-test/
# which sac auto-discovers as the highest-priority agent search root
# whenever it's invoked from inside the project tree (see
# scitex_agent_container/config/_resolve.py::_project_local_dirs).
#
# How to test:
#
#   $ cd ~/proj/scitex-agent-container
#   $ sac start sdk-test --foreground
#   sdk-runtime-ok
#   $
#
# Daemon mode (background + transcript view):
#
#   $ sac start sdk-test
#   $ sac show-status sdk-test
#   $ sac show-logs sdk-test
#   $ sac stop sdk-test
#
# Resume + quota:
#
#   $ cat .scitex/agent-container/runtime/sdk-test/session_id
#   $ cat .scitex/agent-container/runtime/sdk-test/quota.json
#
# Runtime state (heartbeat.json, pid, session.jsonl, session_id,
# quota.json) lands in <repo>/.scitex/agent-container/runtime/sdk-test/
# — gitignored, see ../runtime/.gitignore.

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: claude-session-smoke-test
    in-repo: "true"

spec:
  runtime: claude-session
  model: claude-haiku-4-5
  workdir: /tmp/sac-sdk-test-workspace

  startup_commands:
    - command: "Reply with exactly the string 'sdk-runtime-ok' and nothing else."

  health:
    enabled: true
    interval: 30
    method: multiplexer-alive

  restart:
    policy: never

# EOF
