# In-repo smoke-test agent for the SDK-persistent runner (F-CS16).
#
# This file lives at <repo>/.scitex/agent-container/agents/sdk-test/
# which sac auto-discovers as the highest-priority agent search root
# whenever it's invoked from inside the project tree (see
# scitex_agent_container/config/_resolve.py::_project_local_dirs).
#
# How to test:
#
#   $ cd ~/proj/scitex-agent-container
#   $ sac image build --target sdk-persistent --yes
#   $ sac agent start sdk-test --foreground
#   sdk-runtime-ok
#   $
#
# Daemon mode (background + transcript view):
#
#   $ sac agent start sdk-test
#   $ sac agent status sdk-test
#   $ sac agent logs sdk-test
#   $ sac agent stop sdk-test
#
# State location:
#   <repo>/.scitex/agent-container/runtime/sdk-test/
#   (gitignored — see ../runtime/.gitignore)

apiVersion: scitex-agent-container/v3
kind: Agent

metadata:
  labels:
    pattern: sdk-persistent-smoke-test
    in-repo: "true"

spec:
  runtime: docker
  image: scitex-agent-container:sdk-persistent
  dockerfile: ./containers/Dockerfile.sdk-persistent
  model: claude-haiku-4-5
  workdir: /tmp/sac-sdk-test-workspace

  startup_commands:
    - command: "Reply with exactly the string 'sdk-runtime-ok' and nothing else."

  health:
    enabled: true
    interval: 30
    method: multiplexer-alive

  restart:
    policy: never

# EOF
