# LEGACY — pre-v3 schema (cld-agent/v1).
# Superseded by docs/spec-reference.md (scitex-agent-container/v3).
# Kept for historical reference only. Do NOT use for new agents.
# Loud validation errors are raised at load time for apiVersion: cld-agent/v1.
# Moved from docs/agent-spec-schema.yaml on 2026-05-16.
#
# cld-agent/v1 Agent YAML Schema Reference
#
# This file documents the structure of agent definition files.
# It is not a formal JSON Schema -- it is a human-readable reference.

apiVersion: cld-agent/v1           # Required. Must be "cld-agent/v1"
kind: Agent                        # Required. Must be "Agent"

metadata:
  name: string                     # Required. Unique agent identifier (alphanumeric + hyphens)
  labels:                          # Optional. Key-value pairs for organization
    key: value

spec:
  runtime: string                  # Required. One of: claude-code, slurm, slurm-tenant
  model: string                    # Optional. Model identifier (e.g., opus, sonnet, opus[1m])
  workdir: string                  # Optional. Working directory (default: ~/proj). Supports ~

  # Claude Code specific settings (only used when runtime=claude-code)
  claude:
    channels:                      # Optional. List of channel plugins
      - string                     # e.g., plugin:telegram@claude-plugins-official
    flags:                         # Optional. Additional CLI flags
      - string                     # e.g., --dangerously-skip-permissions
    session: string                # Optional. "continue" or "new" (default: new)

  # Environment variables injected into the agent process
  env:                             # Optional. Key-value map
    KEY: value

  # Screen session configuration
  screen:
    name: string                   # Optional. Screen session name (default: cld-<metadata.name>)

  # Container isolation (optional -- defaults to none, meaning no container)
  container:
    runtime: string              # Optional. One of: none, docker, apptainer (default: none)
    image: string                # Optional. Container image name (default: scitex-agent-container:latest)
    volumes:                     # Optional. Additional volume mounts (host:container format)
      - string                   # e.g., ~/proj:/workspace
    network: string              # Optional. Network mode: host, bridge, none (default: host, docker only)

  # Health check configuration
  health:
    enabled: boolean               # Optional. Enable health monitoring (default: false)
    interval: integer              # Optional. Check interval in seconds (default: 30)
    timeout: integer               # Optional. Check timeout in seconds (default: 5)
    method: string                 # Optional. One of: sdk-alive | a2a-card (default: sdk-alive)

  # Restart policy
  restart:
    policy: string                 # Optional. One of: always, on-failure, never (default: never)
    max_retries: integer           # Optional. Maximum restart attempts (default: 3)
    backoff:
      initial: integer            # Optional. Initial backoff in seconds (default: 30)
      max: integer                # Optional. Maximum backoff in seconds (default: 300)
      multiplier: integer         # Optional. Backoff multiplier (default: 2)

  # External agent communication hub (optional)
  # When present and enabled, .mcp.json is auto-generated at start
  hub:
    enabled: boolean               # Optional. Default: true when hosts is non-empty
    hosts:                         # Required if enabled. Hub server hosts (first used for MCP)
      - string                     # e.g., 192.168.11.22, hub.example.com
    port: integer                  # Optional. Hub WebSocket port (default: 8559)
    token_env: string              # Optional. Env var name for auth token (default: SCITEX_HUB_TOKEN)
    channels:                      # Optional. Channels to subscribe to
      - string                     # e.g., "#general", "server:hub"
    heartbeat_interval: integer    # Optional. Heartbeat interval in seconds (default: 60)

  # Lifecycle hooks (lists of shell commands)
  hooks:
    pre_start: []                  # Optional. Commands to run before starting
    post_start: []                 # Optional. Commands to run after starting
    pre_stop: []                   # Optional. Commands to run before stopping
    post_stop: []                  # Optional. Commands to run after stopping
